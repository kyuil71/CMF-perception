<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>사물 · 물성 · 지각 · 감성 랩 v4</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ==========================================================
       타이포 시스템 — 모든 텍스트 16px 이상을 강제합니다.
       순방향 랩(감성 · 지각 · 물성 · 소재)과 같은 체계를 쓰고,
       역방향 도구임을 구분하도록 강조색만 청록(teal)으로 바꿉니다.
       ========================================================== */
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #e2e8f0;
      color: #0f172a;
      font-size: 17px;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    body * { font-size: inherit; }
    body .t-display { font-size: 34px; line-height: 1.2;  font-weight: 800; letter-spacing: -0.025em; }
    body .t-h1      { font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: -0.015em; }
    body .t-h2      { font-size: 22px; line-height: 1.4;  font-weight: 800; letter-spacing: -0.01em; }
    body .t-h3      { font-size: 19px; line-height: 1.5;  font-weight: 700; }
    body .t-body    { font-size: 17px; line-height: 1.8;  font-weight: 400; }
    body .t-small   { font-size: 16px; line-height: 1.75; }
    body .t-meta    { font-size: 16px; line-height: 1.65; }
    body .t-label   { font-size: 16px; font-weight: 800; letter-spacing: 0.04em; }

    body .prose-ko { text-align: left; white-space: pre-line; }
    /* 로딩·오류 안내처럼 가운데 정렬해야 하는 문구 */
    body .prose-center { text-align: center; white-space: pre-line; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.35s ease-out forwards; }
    @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }

    /* 회전형 로딩 — '동작 줄이기' 설정에서도 반드시 회전합니다. */
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    .spinner-ring {
      width: 84px; height: 84px; border-radius: 50%;
      background: conic-gradient(#0f766e 0 126deg, #e2e8f0 126deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      animation: spinner-rotate 0.9s linear infinite;
      will-change: transform;
    }

    :focus-visible { outline: 3px solid #0f766e; outline-offset: 2px; border-radius: 8px; }
    /* 파일 선택 input은 숨기고 label을 버튼처럼 씁니다. 키보드 초점은 label에 표시합니다. */
    .file-input:focus-visible + label { outline: 3px solid #0f766e; outline-offset: 2px; }

    .dock { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .dock-space { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
    .page-top { padding-top: 128px; }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner-ring), *::before, *::after {
        animation-duration: .001ms !important; transition-duration: .001ms !important;
      }
      .spinner-ring { animation-duration: 1.4s !important; }
    }

    body ::placeholder { font-size: inherit; }
    body summary { font-size: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-region" aria-live="polite" class="sr-only"></div>

  <script type="module">
    (function () {
      "use strict";

      /* =========================================================
         1. CONFIG / 상수
         모델은 GPT-5.6 Terra(분석)와 Image 2.5 Flare(이미지)로 고정합니다.
         프로젝트와 이미지는 모두 IndexedDB에 저장합니다.
         (예전 버전이 localStorage에 남긴 프로젝트는 처음 실행할 때 옮겨 옵니다.)
         ========================================================= */
      const CONFIG = {
        API_BASE: "https://api.openai.com/v1",
        TEXT_MODEL: "gpt-5.6-terra",
        TEXT_MODEL_LABEL: "GPT-5.6 Terra",
        IMAGE_MODEL: "gpt-image-2.5-flare",
        IMAGE_MODEL_LABEL: "Image 2.5 Flare",
        SESSION_KEY_API: "cmf_reverse_openai_key_v2",
        SESSION_KEY_PREFS: "cmf_reverse_prefs_v2",
        PROJECTS_KEY: "cmf_reverse_projects_v2",
        DB: { name: "cmf_reverse_images_v2", images: "images", projects: "projects" },
        PROJECT_DB: "cmf_reverse_projects_v4",
        BACKUP_KEY: "cmf_reverse_last_project_v4",
        MAX_PROJECTS: 5,
        AUTOSAVE_MS: 5000,
        IMAGE_SIZE: "1024x1536",
        IMAGE_STORE_QUALITY: 0.9,
        PHOTO_MAX_EDGE: 1280,
        PHOTO_QUALITY: 0.86
      };

      const IMAGE_STYLES = {
        "Cinematic Architectural Visual":
          "cinematic architectural visualisation: dramatic wide framing of built space, strong directional light cutting through deep shadow, faint atmospheric haze, restrained graded colour, anamorphic film mood",
        "Soft 3D Illustration":
          "soft 3D emotional illustration rendered in high quality CGI: rounded volumes, matte clay or plush surfaces, gentle subsurface glow, tender pastel palette, shallow depth of field, one endearing hero object",
        "Lifestyle Photography":
          "lifestyle action photography: a real moment caught mid-movement, natural available light, visible motion energy, candid off-centre framing, authentic textures and props",
        "Fine Art Landscape Photography":
          "fine art landscape photography: large-format clarity, quiet horizon composition, long tonal range, natural weather light, generous contemplative negative space",
        "Futuristic Architecture Photography":
          "futuristic architecture photography: crisp geometry, precise machined edges, cool reflective envelopes, controlled one-point perspective, clean sky or void background",
        "Abstract Color Flow Render":
          "colour flow abstract render: liquid ribbons and gradient fields caught in motion, smooth CG surfaces, luminous colour transitions, no recognisable object",
        "Luxury Abstract CG Art":
          "luxury abstract CG art: sculptural forms in precious material, studio reflections, refined specular highlights, deep saturated ground, gallery product mood",
        "Soft Macro Nature Photography":
          "soft macro nature photography: extreme close-up of a natural subject, dew drops, fibres and petal edges in razor focus, creamy bokeh, delicate diffused light"
      };
      const STYLE_NAMES = Object.keys(IMAGE_STYLES);
      const STYLE_LIST_TEXT = STYLE_NAMES.map((n, i) => `${i + 1}. ${n}`).join(" / ");
      const STYLE_RULE_TEXT = `표현 대상의 특성에 따라 위 8개 표현 방식 중 가장 적합한 하나를 직접 고릅니다. 의미뿐 아니라 에너지, 긴장도, 공간감, 시간성, 자연성, 추상성을 함께 고려해 결정합니다. 같은 스타일을 기계적으로 반복하지 않습니다.`;

      const LABEL_LANGS = [
        { id: "en", label: "영문만" },
        { id: "ko", label: "한글 + 영문" }
      ];
      const QUALITIES = [
        { id: "medium", label: "표준" },
        { id: "high",   label: "고품질" }
      ];

      const EMOTION_METHOD = {
        label: "지각·경험 중심 감성디자인",
        en: "Emotion & Perception-centered Design",
        guide: `지각을 곧바로 감성 단어로 바꾸지 않습니다. 먼저 사람이 이 사물을 보고, 가까이 가고, 만지고, 움직이거나 사용하면서 무엇을 감지하고 어떻게 경험하는지 해석합니다. 그 경험이 만드는 정서적 온도, 에너지, 긴장과 이완, 안정감, 활동성, 세련됨, 생동감, 무게감, 친근함, 낯섦과 같은 감성 결과를 구체적으로 정리합니다.`
      };

      const STAGES = [
        { n: 1, label: "사물 입력" },
        { n: 2, label: "물성 분석" },
        { n: 3, label: "지각 분석" },
        { n: 4, label: "감성 분석" }
      ];

      const SAMPLE_OBJECTS = ["나뭇잎", "조약돌", "유리컵", "가죽 지갑", "의자", "조개껍데기", "얼음 조각", "니트 스웨터"];
      const FEATURE_CATEGORIES = ["형태", "구조", "색상", "소재", "표면", "접합·구성", "견고성", "가동·기능", "기타"];
      const OBJECT_KINDS = ["자연물", "인공물", "가공된 자연물"];

      const NO_DATA = "이 항목은 AI 응답에 포함되지 않았습니다. 다시 생성해 보세요.";

      /* =========================================================
         2. PROMPTS — 텍스트
         사물 → 전체 특징 → 물성 → 지각 → 감성
         고정된 CMF 프레임이나 고정 개수에 맞추지 않고 사물 자체에 필요한 항목을 AI가 정합니다.
         각 항목은 앞 단계 항목 번호(from)를 근거로 돌려받아 추적 경로를 보여 줍니다.
         ========================================================= */
      const SYSTEM = `당신은 제품디자인, 사물 관찰, 구조·재료·물성 공학, 지각심리학, 감성디자인, CMF(Color·Material·Finish), Material Experience Research를 함께 다루는 시니어 디자인 리서처입니다.
이 도구는 하나의 사물을 출발점으로 그 사물의 전체적인 특징을 관찰하고, 중요한 물성을 읽어 낸 뒤, 사람이 무엇을 지각하고 최종적으로 어떤 감성을 갖게 되는지를 단계적으로 분석합니다.
- 첫 단계는 CMF만 분석하지 않습니다. 형태, 비례, 구조, 색상, 소재, 표면, 접합, 견고성, 가동부, 기능적 구성 등 사물을 이해하는 데 중요한 특징을 종합적으로 봅니다.
- 물성 단계는 보이는 성질, 만져지는 성질, 움직임, 변형, 저항, 복원, 소리, 온도, 무게, 시간에 따른 변화와 반응을 폭넓게 검토합니다.
- 지각 단계는 순간적인 감지와 사용·접촉을 통해 누적되는 경험적 지각을 함께 다룹니다.
- 감성 단계는 기쁨/슬픔 같은 정서뿐 아니라 활기참, 차분함, 세련됨, 생동감, 안정감, 친근함, 무거움, 긴장감 등 사물을 경험한 뒤 형성되는 감성적 인상을 다룹니다.
- 항목 개수는 고정하지 않습니다. 중요한 차이가 충분히 설명되도록 AI가 사물에 맞는 개수를 결정하되, 중복되거나 의미가 약한 항목은 넣지 않습니다.
- 특정 개인의 취향보다 대부분의 사람이 일상에서 이 사물을 마주할 때 공통으로 겪는 보편적인 상황을 기준으로 분석합니다.
- 각 단계는 가능한 한 앞 단계의 관찰과 분석 결과를 근거로 연결합니다. 사물 이름에 붙은 통념이나 상징으로 건너뛰지 않습니다.
- 모든 한국어 문장은 정중하고 명확한 존댓말로 작성합니다.
- 반드시 요청받은 JSON 객체 하나만 반환합니다. 설명, 머리말, 코드펜스를 붙이지 않습니다.`;

      const listTraits = items => items.map(t =>
        `${t.index}. [${t.category}] ${t.titleKo} (${t.titleEn}) — ${t.observation}`).join("\n");
      const listProperties = items => items.map(p =>
        `${p.index}. [${p.axis}] ${p.titleKo} (${p.titleEn}) · 추정 ${p.level} ${p.value} — ${p.description}`).join("\n");
      const listPerceptions = items => items.map(p =>
        `${p.index}. [${p.moment}] ${p.titleKo} (${p.titleEn}) — ${p.description}`).join("\n");
      const listEmotions = items => items.map(l =>
        `${l.index}. [${l.phase}] ${l.nameKo} (${l.nameEn}) · 강도 ${l.intensity} — ${l.description}`).join("\n");
      const objectHead = o => `분석 사물: ${o.nameKo}${o.nameEn ? ` (${o.nameEn})` : ""} · ${o.kind}\n기준 표본: ${o.specimen || o.summary}`;

      const PROMPTS = {
        OBJECT: (keyword, note, hasPhoto, instruction) => `${hasPhoto
  ? `[입력 방식] 사용자가 사물 사진을 첨부했습니다.${keyword ? ` 사용자가 적은 사물 이름: "${keyword}"` : " 사물 이름은 적지 않았습니다. 사진에서 직접 판별합니다."}`
  : `[입력 방식] 사진 없이 사물 키워드만 입력되었습니다: "${keyword}"`}
${note ? `연관 과제(참고용, 분석 기준은 보편적 상황): ${note}\n` : ""}
[분석 프로세스]
사물 관찰 → 전체 특징 → 물성 → 지각 → 감성 순서로 분석합니다. 지금은 첫 단계인 '사물 특징 분석'입니다.

[목표]
이 사물이 어떤 사물인지 한눈에 이해할 수 있도록 전체적인 특징을 간단하고 정확하게 정리합니다. CMF만 보지 말고 형태와 구조, 색상, 소재, 표면, 접합·구성, 견고성, 가동·기능 등 이 사물의 경험에 영향을 줄 중요한 특징을 모두 검토합니다.
예를 들어 의자라면 등받이·좌판·다리의 구조와 비례, 색상, 사용 소재, 표면 상태, 프레임의 견고함, 쿠션의 두께와 구성, 접합 방식, 움직이거나 조절되는 부위 등을 필요에 따라 포함합니다.

[분석 기준 표본]
- 사진이 있으면 사진 속 개체를 기준으로 합니다. 사진에서 보이지 않는 면은 확정적으로 지어내지 말고 필요하면 '추정'으로 표시합니다.
- 조명 색, 배경, 촬영 각도처럼 촬영 조건에서만 생긴 요소는 사물 고유 특징과 구분합니다.
- 키워드만 있으면 대부분의 사람이 떠올리는 전형적인 표본 하나를 기준으로 정합니다.
- 사진 속 대상이 여러 개면 가장 중심이 되는 하나를 고르고 그 이유를 specimen에 적습니다.
- 사람이 찍혀 있으면 얼굴이나 신원은 분석하지 않고 대상 사물만 분석합니다.

[사물 개요]
- "nameKo", "nameEn": 사물 이름입니다.
- "kind": "자연물", "인공물", "가공된 자연물" 중 가장 가까운 것을 씁니다.
- "summary": 2~3문장. 무엇인지, 전체 형태와 구조적 특징, 눈에 띄는 상태를 간단히 요약합니다.
- "specimen": 1문장. 분석 기준 표본입니다.
- "palette": 대표 색 3~5개. 각 색은 {"hex":"#RRGGBB","name":"한글 색 이름","role":"주조색|보조색|강조색|음영색"}입니다.
- "visual": 기준 표본 전체를 명확하게 보여 주는 영어 이미지 프롬프트 2문장입니다.

[사물의 핵심 특징]
- 고정 개수는 없습니다. 사물을 이해하는 데 중요한 특징을 빠짐없이 담되, 서로 겹치는 항목은 합칩니다. 일반적으로 6~10개가 적절하지만 사물에 따라 더 적거나 많아도 됩니다.
- 다음 범주를 모두 검토하되 해당 사물과 무관한 범주는 억지로 넣지 않습니다: 형태·비례 / 구조·구성 / 색상 / 소재 / 표면·마감 / 접합·디테일 / 견고성·안정성 / 가동·기능 / 기타 중요한 특징.
- "category": 위 내용을 표현하는 짧은 한글 분류명입니다. 예: "형태", "구조", "색상", "소재", "견고성", "가동·기능".
- "titleKo": 특징을 짚는 짧은 명사구입니다.
- "titleEn": 영문명 2~5단어입니다.
- "observation": 1~2문장. 무엇이 어떤 방식으로 구성·형성되어 있는지를 간단히 설명합니다.
- "evidence": 1문장. 사진 입력이면 어느 부위에서, 키워드 입력이면 전형적 표본의 어느 부분에서 확인되는지 적습니다.
- "certainty": 직접 확인 가능한 내용은 "관찰", 구조나 재료 등을 단서로 추론한 내용은 "추정"입니다.
- "visual": 해당 특징이 가장 잘 드러나는 영어 이미지 프롬프트 1~2문장입니다. 전체 형태, 구조 디테일, 표면 확대 등 특징에 맞는 시점을 선택합니다.
- "label"은 2~4단어 영문 제목, "labelKo"는 10자 이내 한글 제목입니다.

        return Array.from(new Set(items.map((it, i) => styleOf(it, i).name))).join(", ");
      }

      /* 이미지에 찍을 라벨 — 설정에 따라 한글을 함께 넣습니다. */
      function labelLine(ko, en, i) {
        return state.labelLang === "ko" && ko
          ? `"${pad2(i + 1)}" in bold followed by "${q(ko)}  ${q(en)}" on the SAME line`
          : `"${pad2(i + 1)}" in bold followed by "${q(en)}"`;
      }

      const IMG = {
        /* ---- 칸 하나를 설명하는 문장 (전체 보드와 부분 편집이 같은 문장을 씁니다) ---- */
        propertyCell(p, i) {
          return `Card ${i + 1}:
  Header text on white: ${state.labelLang === "ko" && p.titleKo
            ? `"${pad2(i + 1)}" in bold followed by "${q(p.titleKo)}" and a smaller second line "${q(p.titleEn)}"`
            : `"${pad2(i + 1)}" in bold followed by "${q(p.titleEn)}"`}.
  Optional small axis badge: "${q(p.axis)}".
  Image direction: ${p.visual || p.description}`;
        },
        perceptionCell(p, i) {
          const st = styleOf(p, i);
          return `Cell ${i + 1} — perception context "${q(p.moment)}": one complete standalone perceptual reference image, rendered as ${st.directive}.
  Everyday situation: ${q(p.situation)}
  What is perceived: ${p.titleEn} / ${p.titleKo}.
  Single-scene direction: ${p.visual}
  Demonstrate the perceptual experience itself — visual, tactile, spatial, weight/force, movement, response, sound, temporal or use-related — rather than making a generic beauty shot. Do not depict the analysed object itself.
  White caption strip directly under this image: ${labelLine(p.labelKo || p.titleKo, p.label || p.titleEn, i)}.`;
        },
        emotionPanel(l, i) {
          const st = styleOf(l, i);
          return `Panel ${i + 1} — emotional keyword image, rendered as ${st.directive}.
  Emotion: ${l.nameKo} / ${l.nameEn}.
  Relative intensity: ${Number.isFinite(Number(l.intensity)) ? Math.round(Number(l.intensity)) : 60}/100.
  Single-scene direction: ${l.visual}
  Translate the emotional quality into one coherent design-magazine scene; do not simply repeat the analysed object.
  Caption strip along the bottom edge: ${labelLine(l.labelKo || l.nameKo, l.label || l.nameEn, i)}.`;
        },

        property(items) {
          return `${IMG_BASE}
Create ONE single vertical 2:3 integrated image file that presents exactly ${items.length} material-and-physical-property cards on a clean premium editorial board.
Layout: a compact multi-row two-column grid of bordered white cards with thin light-grey lines and generous outer margins. Fit all cards cleanly on one board.
Each card contains ONE image that clearly communicates the property or response: optical behaviour, texture, friction, stiffness, compression, weight/inertia, bending, motion, recovery, vibration, sound, thermal response, wear, or another specified phenomenon.
The original object may appear when needed to show motion, force, contact or structural response; do not reduce every property to a generic surface sample.
One property, one image, one card. Render only the specified card texts and no extra paragraphs.
${items.map((p, i) => IMG.propertyCell(p, i)).join("\n")}`;
        },
        perception(items) {
          return `${IMG_BASE}
Create ONE single vertical 2:3 integrated image file containing exactly ${items.length} perceptual-reference images on a clean white editorial board.
Layout: a balanced adaptive two-column grid, read left-to-right and top-to-bottom. Each cell has one image plus a white caption strip beneath. Thin light-grey hairlines, consistent gutters, generous margins.
The images collectively explain the important perceptions inferred from the analysed object, but they must NOT directly re-depict that object. Instead, each image should choose the most fitting inspirational subject — architecture, fashion, illustration, nature, lighting, furniture, spatial detail, or another design-relevant scene — to express the perception most clearly.
${items.map((p, i) => IMG.perceptionCell(p, i)).join("\n")}

[DIVERSITY RULES]
- Include both immediate perceptions and experience-based perceptions when specified.
- Never use the analysed object itself as the hero subject. Translate the perception into the most effective inspirational subject.
- Vary scale, camera angle, body/hand interaction, lighting, motion state and spatial context according to each perception.
- No identifiable faces; hands or partial bodies only when they help explain contact, force, posture, movement or use.
- Avoid repeating the same composition.
- Styles used: ${styleNote(items)}.
${IMG_LABEL_RULE}`;
        },
        emotion(emotion) {
          const layers = emotion.layers || [];
          return `${IMG_BASE}
Generate ONE single vertical 2:3 editorial mood board containing exactly ${layers.length === 1 ? "ONE" : "TWO"} refined emotion image${layers.length === 1 ? "" : "s"} derived from the analysed object.
These are the most representative experience-based emotional keywords a user is left with after encountering the object.
Layout: equal full-width panels stacked vertically, with narrow white outer margins, thin light-grey dividers and clean caption strips.
Each panel should feel like a premium design-magazine image similar in sophistication to the perception imagery. Use elegant scenes, not infographic symbols.
${layers.map((l, i) => IMG.emotionPanel(l, i)).join("\n")}
${IMG_LABEL_RULE}`;
        },

        /* 단계 이름으로 전체 보드 프롬프트를 고릅니다. */
        board(key) {
          if (key === "property") return IMG.property(state.properties);
          if (key === "perception") return IMG.perception(state.perceptions);
          if (key === "emotion") return state.emotion ? IMG.emotion(state.emotion) : "";
          return "";
        },

        /* 기존 통합 이미지에서 한 칸만 바꾸는 편집 프롬프트 */
        edit(key, idx) {
          const map = {
            property:   { unit: "card",  list: state.properties, cell: IMG.propertyCell },
            perception: { unit: "cell",  list: state.perceptions, cell: IMG.perceptionCell },
            emotion:    { unit: "panel", list: state.emotion ? state.emotion.layers : [], cell: IMG.emotionPanel }
          };
          const spec = map[key];
          const item = spec.list.find(x => x.index === idx);
          const n = pad2(idx);
          return `Edit the supplied image. It is a finished vertical 2:3 editorial board containing exactly ${spec.list.length} numbered ${spec.unit}s, each with one picture and a white caption strip whose text starts with its number.
Change ONLY ${spec.unit} ${n} — the ${spec.unit} whose caption starts with "${n}". Replace that ${spec.unit}'s picture and caption with the new content below, inside exactly the same frame position and size.
Keep everything else exactly as it is: every other ${spec.unit}'s picture, crop, colours, lighting and caption text; the grid, gutters, hairlines, margins, background, overall layout and typography. Do not redraw, restyle, reorder, renumber or re-letter anything outside ${spec.unit} ${n}.
New content for ${spec.unit} ${n}:
${spec.cell(item, idx - 1)}
Set the new caption in the same font, weight, size and white strip as the other captions, large and clearly legible. Add no other new text anywhere. No watermark, no logo, no identifiable faces.`;
        }
      };

      /* =========================================================
         4. 유틸 — 이스케이프 / 토스트 / ID
         ========================================================= */
      let uidSeq = 0;
      const uid = p => `${p}_${Date.now().toString(36)}_${(uidSeq++).toString(36)}`;

      function esc(v) {
        return String(v === null || v === undefined ? "" : v)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      const escAttr = esc;

      const nowLabel = t => new Date(t).toLocaleString("ko-KR", {
        year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });

      let toastTimer = null;
      function toast(msg, kind) {
        const region = document.getElementById("toast-region");
        if (region) region.textContent = msg;
        let el = document.getElementById("toast-visual");
        if (!el) {
          el = document.createElement("div");
          el.id = "toast-visual";
          document.body.appendChild(el);
        }
        el.className = "fixed left-1/2 -translate-x-1/2 bottom-[calc(28px+env(safe-area-inset-bottom))] z-[10050] px-5 py-3.5 rounded-2xl shadow-2xl t-small font-bold text-white max-w-[92vw] text-center " +
          (kind === "error" ? "bg-red-700" : "bg-slate-900");
        el.textContent = msg;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 3600);
      }

      function isQuotaError(e) {
        if (!e) return false;
        const n = String(e.name || "");
        const m = String(e.message || "");
        return /quota/i.test(n) || /quota/i.test(m) || e.code === 22 || e.code === 1014 || n === "NS_ERROR_DOM_QUOTA_REACHED";
      }

      /* =========================================================
         5. 저장소 — 프로젝트와 이미지 모두 IndexedDB (프로젝트는 별도 DB)
         localStorage는 브라우저 전체가 약 5MB를 함께 쓰기 때문에 같은 주소의 다른 도구와
         용량을 나눠 쓰다 쉽게 가득 찹니다. IndexedDB는 훨씬 큰 공간을 쓸 수 있습니다.
         그래도 공간이 부족하면 지금 작업 중인 프로젝트를 뺀 가장 오래된 프로젝트부터
         지워 공간을 확보한 뒤 다시 저장합니다.
         ========================================================= */
      const IMAGE_SLOTS = ["source", "cmf", "property", "perception", "emotion"];
      const blankImages = () => ({ source: null, cmf: null, property: null, perception: null, emotion: null });

      /* ---------------------------------------------------------
         IndexedDB 열기
         - 버전을 지정하지 않고 엽니다. 예전 버전(v3)이 다른 탭에 열려 있어도
           업그레이드 충돌(차단)이 생기지 않습니다.
         - 필요한 저장소가 없을 때만 버전을 올려 만듭니다.
         - '차단됨' 신호가 와도 바로 실패하지 않고 다른 탭이 닫힐 때까지 기다립니다.
         --------------------------------------------------------- */
      const dbCache = {};
      function openDb(name, stores) {
        if (!("indexedDB" in window) || !window.indexedDB) return Promise.reject(new Error("IDB_UNAVAILABLE"));
        if (dbCache[name]) return dbCache[name];
        const attempt = version => new Promise((res, rej) => {
          let req;
          try { req = version ? indexedDB.open(name, version) : indexedDB.open(name); } catch (e) { rej(e); return; }
          req.onupgradeneeded = () => {
            const db = req.result;
            stores.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); });
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
          req.onblocked = () => { console.warn(`${name}: 다른 탭이 저장소를 쓰고 있어 기다립니다.`); };
        });
        const p = (async () => {
          let db = await attempt(0);
          if (!stores.every(s => db.objectStoreNames.contains(s))) {
            const v = db.version + 1;
            db.close();
            db = await attempt(v);
          }
          db.onversionchange = () => { try { db.close(); } catch (e) { /* 무시 */ } delete dbCache[name]; };
          db.onclose = () => { delete dbCache[name]; };
          return db;
        })();
        const timed = Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("IDB_TIMEOUT")), 15000))]);
        dbCache[name] = timed;
        timed.catch(() => { if (dbCache[name] === timed) delete dbCache[name]; });
        return timed;
      }

      const DBS = {
        images: { name: CONFIG.DB.name, stores: [CONFIG.DB.images] },
        projects: { name: CONFIG.PROJECT_DB, stores: [CONFIG.DB.projects] }
      };
      const dbFor = store => (store === CONFIG.DB.images ? DBS.images : DBS.projects);

      const DB = {
        /* 용량 초과는 요청이 아니라 트랜잭션 중단(abort)으로 알려지므로 트랜잭션 완료를 기준으로 판단합니다. */
        runOn(db, storeName, mode, fn) {
          return new Promise((res, rej) => {
            let tx;
            try { tx = db.transaction(storeName, mode); } catch (e) { rej(e); return; }
            let result;
            let rq;
            try { rq = fn(tx.objectStore(storeName)); }
            catch (e) { rej(e); try { tx.abort(); } catch (x) { /* 무시 */ } return; }
            rq.onsuccess = () => { result = rq.result; };
            tx.oncomplete = () => res(result);
            tx.onerror = () => rej(tx.error || rq.error || new Error("IDB_REQUEST_FAILED"));
            tx.onabort = () => rej(tx.error || new Error("IDB_ABORTED"));
          });
        },
        run(storeName, mode, fn) {
          const d = dbFor(storeName);
          return openDb(d.name, d.stores).then(db => DB.runOn(db, storeName, mode, fn));
        },
        put: (s, v) => DB.run(s, "readwrite", st => st.put(v)),
        get: (s, k) => DB.run(s, "readonly", st => st.get(k)),
        getAll: s => DB.run(s, "readonly", st => st.getAll()),
        del: (s, k) => DB.run(s, "readwrite", st => st.delete(k))
      };

      const ImageDB = {
        key: (projectId, slot) => `${projectId}::${slot}`,
        async put(projectId, slot, dataUrl) {
          for (let i = 0; i <= CONFIG.MAX_PROJECTS; i++) {
            try {
              await DB.put(CONFIG.DB.images, { id: ImageDB.key(projectId, slot), projectId, slot, dataUrl, savedAt: Date.now() });
              return true;
            } catch (e) {
              if (!isQuotaError(e)) { console.warn("이미지 저장 실패", e); return false; }
              const victim = Store.oldestExcept(projectId);
              if (!victim) return false;
              await Store.remove(victim.id);
              toast(`저장 공간을 확보하려고 오래된 프로젝트 '${victim.title}'를 정리했습니다.`);
            }
          }
          return false;
        },
        async get(projectId, slot) {
          try {
            const row = await DB.get(CONFIG.DB.images, ImageDB.key(projectId, slot));
            return row && row.dataUrl ? row.dataUrl : null;
          } catch (e) { return null; }
        },
        async loadAll(projectId) {
          const out = blankImages();
          for (const slot of IMAGE_SLOTS) out[slot] = await ImageDB.get(projectId, slot);
          return out;
        },
        remove(projectId, slot) {
          return DB.del(CONFIG.DB.images, ImageDB.key(projectId, slot)).catch(() => {});
        },
        removeProject(projectId) {
          return Promise.all(IMAGE_SLOTS.map(slot => ImageDB.remove(projectId, slot)));
        }
      };

      /* ---------------------------------------------------------
         예비 사본 — 마지막으로 저장한 프로젝트 한 개를 localStorage에도 남깁니다.
         IndexedDB 기록이 늦거나 실패해도 마지막 수정이 사라지지 않게 하는 안전장치입니다.
         (이미지는 넣지 않으므로 수십 KB 수준입니다.)
         --------------------------------------------------------- */
      const Backup = {
        read() {
          try {
            const raw = localStorage.getItem(CONFIG.BACKUP_KEY);
            const r = raw ? JSON.parse(raw) : null;
            return r && r.id && r.data ? r : null;
          } catch (e) { return null; }
        },
        write(row) {
          try { localStorage.setItem(CONFIG.BACKUP_KEY, JSON.stringify(row)); return true; }
          catch (e) { return false; }
        },
        clearIf(id) {
          const b = Backup.read();
          if (b && b.id === id) { try { localStorage.removeItem(CONFIG.BACKUP_KEY); } catch (e) { /* 무시 */ } }
        }
      };

      const newer = (a, b) => (!a ? b : (!b ? a : ((b.savedAt || 0) > (a.savedAt || 0) ? b : a)));

      /* 같은 프로젝트가 여러 곳에 있으면 가장 최근에 저장된 것을 고릅니다. */
      function mergeRows(lists) {
        const map = {};
        lists.forEach(list => (list || []).forEach(r => {
          if (r && r.id && r.data) map[r.id] = newer(map[r.id], r);
        }));
        return Object.keys(map).map(k => map[k]);
      }

      const Store = {
        ready: false,
        mode: "idb",
        cache: [],
        lastSig: {},
        failedSig: {},
        queue: Promise.resolve(),

        readLegacy() {
          try {
            const raw = localStorage.getItem(CONFIG.PROJECTS_KEY);
            const l = raw ? JSON.parse(raw) : [];
            return Array.isArray(l) ? l.filter(p => p && p.id) : [];
          } catch (e) { return []; }
        },

        /* 이전 v4가 이미지 저장소 안에 두던 프로젝트 기록 — 업그레이드 없이 읽기만 합니다. */
        async readOldV4() {
          try {
            const db = await openDb(DBS.images.name, DBS.images.stores);
            if (!db.objectStoreNames.contains(CONFIG.DB.projects)) return [];
            const rows = await DB.runOn(db, CONFIG.DB.projects, "readonly", st => st.getAll());
            return Array.isArray(rows) ? rows.filter(p => p && p.id) : [];
          } catch (e) { return []; }
        },
        async clearOldV4(ids) {
          try {
            const db = await openDb(DBS.images.name, DBS.images.stores);
            if (!db.objectStoreNames.contains(CONFIG.DB.projects)) return;
            for (const id of ids) await DB.runOn(db, CONFIG.DB.projects, "readwrite", st => st.delete(id));
          } catch (e) { /* 무시 */ }
        },

        async init() {
          const legacy = Store.readLegacy();
          const backup = Backup.read();
          try {
            const current = await DB.getAll(CONFIG.DB.projects);
            const curList = Array.isArray(current) ? current.filter(p => p && p.id) : [];
            const oldV4 = await Store.readOldV4();
            const merged = mergeRows([curList, oldV4, legacy, backup ? [backup] : []]);

            /* IndexedDB에 있는 것보다 새로운 기록만 옮겨 적습니다. */
            let allMoved = true;
            for (const r of merged) {
              const inDb = curList.find(x => x.id === r.id);
              if (inDb && (inDb.savedAt || 0) >= (r.savedAt || 0)) continue;
              try { await DB.put(CONFIG.DB.projects, r); }
              catch (e) { allMoved = false; console.warn("예전 기록을 옮기지 못했습니다.", e); }
            }
            /* 모두 안전하게 옮긴 뒤에만 예전 기록을 지웁니다. */
            if (allMoved) {
              if (legacy.length) { try { localStorage.removeItem(CONFIG.PROJECTS_KEY); } catch (e) { /* 무시 */ } }
              if (oldV4.length) await Store.clearOldV4(oldV4.map(r => r.id));
            }
            Store.mode = "idb";
            Store.cache = merged;
          } catch (e) {
            console.warn("IndexedDB를 쓸 수 없어 브라우저 기본 저장소를 사용합니다.", e);
            Store.mode = "ls";
            Store.cache = mergeRows([legacy, backup ? [backup] : []]);
          }

          Store.cache.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          const extra = Store.cache.slice(CONFIG.MAX_PROJECTS);
          Store.cache = Store.cache.slice(0, CONFIG.MAX_PROJECTS);
          for (const p of extra) await Store._purge(p.id);
          if (Store.mode === "ls") {
            try { localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(Store.cache)); } catch (e) { /* 무시 */ }
          }
          Store.ready = true;

          /* 브라우저가 공간이 부족할 때 임의로 지우지 않도록 영구 저장을 요청합니다. */
          try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* 무시 */ }
        },

        /* 다른 탭이나 창에서 저장한 내용까지 반영해 목록을 새로 읽습니다. */
        async refresh() {
          if (!Store.ready || Store.mode !== "idb") return;
          try {
            const rows = await DB.getAll(CONFIG.DB.projects);
            const b = Backup.read();
            const merged = mergeRows([Store.cache, rows, b ? [b] : []])
              .filter(r => (rows || []).some(x => x.id === r.id) || Store.cache.some(x => x.id === r.id));
            merged.sort((a, c) => (c.savedAt || 0) - (a.savedAt || 0));
            Store.cache = merged.slice(0, CONFIG.MAX_PROJECTS);
          } catch (e) { /* 읽기 실패 시 기존 목록 유지 */ }
        },

        /* 프로젝트를 열 때는 메모리 목록이 아니라 저장소에서 가장 최근 기록을 직접 읽습니다. */
        async fetchLatest(id) {
          let row = Store.cache.find(p => p.id === id) || null;
          if (Store.mode === "idb") {
            try { row = newer(row, await DB.get(CONFIG.DB.projects, id)); } catch (e) { /* 메모리 기록 사용 */ }
          }
          const b = Backup.read();
          if (b && b.id === id) row = newer(row, b);
          return row && row.data ? row : null;
        },

        list() { return Store.cache.slice(); },

        /* 목록은 최신순이므로 맨 뒤가 가장 오래된 프로젝트입니다. */
        oldestExcept(id) {
          const others = Store.cache.filter(p => p.id !== id);
          return others.length ? others[others.length - 1] : null;
        },

        async _purge(id) {
          if (Store.mode === "idb") { try { await DB.del(CONFIG.DB.projects, id); } catch (e) { /* 무시 */ } }
          await ImageDB.removeProject(id);
          Backup.clearIf(id);
          delete Store.lastSig[id];
        },

        async _writeRow(row) {
          if (Store.mode === "idb") await DB.put(CONFIG.DB.projects, row);
          else localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(Store.cache));
        },

        /* 저장 요청은 순서대로 하나씩 처리해 서로 덮어쓰지 않게 합니다. */
        save(snap, meta) {
          const job = Store.queue.then(() => Store._save(snap, meta));
          Store.queue = job.catch(() => {});
          return job;
        },

        async _save(snap, meta) {
          let sig;
          try { sig = `${meta.title}\u0000${JSON.stringify(snap)}`; } catch (e) { return { ok: false }; }
          if (Store.lastSig[meta.id] === sig && Store.cache.some(p => p.id === meta.id)) return { ok: true, unchanged: true, freed: [] };

          /* 저장 순간의 내용을 깊은 복사로 고정해 이후 화면 변경과 섞이지 않게 합니다. */
          const row = { id: meta.id, title: meta.title, savedAt: Date.now(), data: JSON.parse(JSON.stringify(snap)) };
          /* 예비 사본을 먼저 남깁니다. 아래 기록이 실패해도 다음 실행 때 이 사본으로 복구됩니다. */
          Backup.write(row);

          Store.cache = [row].concat(Store.cache.filter(p => p.id !== meta.id));
          while (Store.cache.length > CONFIG.MAX_PROJECTS) {
            const old = Store.cache.pop();
            await Store._purge(old.id);
          }

          const freed = [];
          for (;;) {
            try {
              await Store._writeRow(row);
              Store.lastSig[meta.id] = sig;
              const firstFail = !!Store.failedSig[meta.id];
              delete Store.failedSig[meta.id];
              return { ok: true, freed, recovered: firstFail };
            } catch (e) {
              if (!isQuotaError(e)) {
                console.warn("프로젝트 저장 실패", e);
                const repeat = Store.failedSig[meta.id] === sig;
                Store.failedSig[meta.id] = sig;
                return { ok: false, repeat };
              }
              const victim = Store.oldestExcept(meta.id);
              if (!victim) {
                const repeat = Store.failedSig[meta.id] === sig;
                Store.failedSig[meta.id] = sig;
                return { ok: false, full: true, repeat };
              }
              Store.cache = Store.cache.filter(p => p.id !== victim.id);
              await Store._purge(victim.id);
              freed.push(victim.title);
            }
          }
        },

        async remove(id) {
          Store.cache = Store.cache.filter(p => p.id !== id);
          await Store._purge(id);
          if (Store.mode === "ls") {
            try { localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(Store.cache)); } catch (e) { /* 무시 */ }
          }
        }
      };

      /* =========================================================

         ========================================================= */
      function loadSession() {

          sessionStorage.setItem(CONFIG.SESSION_KEY_PREFS, JSON.stringify({ quality: state.quality, labelLang: state.labelLang }));
