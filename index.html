<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>사물 · 물성 · 지각 · 감성 랩 v8</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ==========================================================
       타이포 시스템 — 모든 텍스트 16px 이상을 강제합니다.
       순방향 랩(감성 · 지각 · 물성 · 소재)과 같은 체계를 쓰고,
       역방향 도구임을 구분하도록 강조색만 청록(teal)으로 바꿉니다.
       ========================================================== */
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #e2e8f0;
      color: #0f172a;
      font-size: 17px;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    body * { font-size: inherit; }
    body .t-display { font-size: 34px; line-height: 1.2;  font-weight: 800; letter-spacing: -0.025em; }
    body .t-h1      { font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: -0.015em; }
    body .t-h2      { font-size: 22px; line-height: 1.4;  font-weight: 800; letter-spacing: -0.01em; }
    body .t-h3      { font-size: 19px; line-height: 1.5;  font-weight: 700; }
    body .t-body    { font-size: 17px; line-height: 1.8;  font-weight: 400; }
    body .t-small   { font-size: 16px; line-height: 1.75; }
    body .t-meta    { font-size: 16px; line-height: 1.65; }
    body .t-label   { font-size: 16px; font-weight: 800; letter-spacing: 0.04em; }

    body .prose-ko { text-align: left; white-space: pre-line; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.35s ease-out forwards; }
    @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }

    /* 회전형 로딩 — '동작 줄이기' 설정에서도 반드시 회전합니다. */
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    .spinner-ring {
      width: 84px; height: 84px; border-radius: 50%;
      background: conic-gradient(#0f766e 0 126deg, #e2e8f0 126deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      animation: spinner-rotate 0.9s linear infinite;
      will-change: transform;
    }

    :focus-visible { outline: 3px solid #0f766e; outline-offset: 2px; border-radius: 8px; }
    /* 파일 선택 input은 숨기고 label을 버튼처럼 씁니다. 키보드 초점은 label에 표시합니다. */
    .file-input:focus-visible + label { outline: 3px solid #0f766e; outline-offset: 2px; }

    .dock { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .dock-space { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
    .page-top { padding-top: 128px; }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner-ring), *::before, *::after {
        animation-duration: .001ms !important; transition-duration: .001ms !important;
      }
      .spinner-ring { animation-duration: 1.4s !important; }
    }

    body ::placeholder { font-size: inherit; }
    body summary { font-size: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-region" aria-live="polite" class="sr-only"></div>

  <script type="module">
    (function () {
      "use strict";

      /* =========================================================
         1. CONFIG / 상수
         모델은 GPT-5.6 Terra(분석)와 Image 2.5 Flare(이미지)로 고정합니다.
         저장 데이터 구조가 v1(선택형)과 달라 저장 키를 v2로 분리합니다.
         ========================================================= */
      const CONFIG = {
        API_BASE: "https://api.openai.com/v1",
        TEXT_MODEL: "gpt-5.6-terra",
        TEXT_MODEL_LABEL: "GPT-5.6 Terra",
        IMAGE_MODEL: "gpt-image-2.5-flare",
        IMAGE_MODEL_LABEL: "Image 2.5 Flare",
        SESSION_KEY_API: "cmf_reverse_openai_key_v2",
        SESSION_KEY_PREFS: "cmf_reverse_prefs_v2",
        PROJECTS_KEY: "cmf_reverse_projects_v2",
        IMAGE_DB: { name: "cmf_reverse_images_v2", store: "images" },
        MAX_PROJECTS: 5,
        AUTOSAVE_MS: 5000,
        IMAGE_SIZE: "1024x1536",
        PHOTO_MAX_EDGE: 1280,
        PHOTO_QUALITY: 0.86
      };

      const IMAGE_STYLES = {
        "Cinematic Architectural Visual":
          "cinematic architectural visualisation: dramatic wide framing of built space, strong directional light cutting through deep shadow, faint atmospheric haze, restrained graded colour, anamorphic film mood",
        "Soft 3D Illustration":
          "soft 3D emotional illustration rendered in high quality CGI: rounded volumes, matte clay or plush surfaces, gentle subsurface glow, tender pastel palette, shallow depth of field, one endearing hero object",
        "Lifestyle Photography":
          "lifestyle action photography: a real moment caught mid-movement, natural available light, visible motion energy, candid off-centre framing, authentic textures and props",
        "Fine Art Landscape Photography":
          "fine art landscape photography: large-format clarity, quiet horizon composition, long tonal range, natural weather light, generous contemplative negative space",
        "Futuristic Architecture Photography":
          "futuristic architecture photography: crisp geometry, precise machined edges, cool reflective envelopes, controlled one-point perspective, clean sky or void background",
        "Abstract Color Flow Render":
          "colour flow abstract render: liquid ribbons and gradient fields caught in motion, smooth CG surfaces, luminous colour transitions, no recognisable object",
        "Luxury Abstract CG Art":
          "luxury abstract CG art: sculptural forms in precious material, studio reflections, refined specular highlights, deep saturated ground, gallery product mood",
        "Soft Macro Nature Photography":
          "soft macro nature photography: extreme close-up of a natural subject, dew drops, fibres and petal edges in razor focus, creamy bokeh, delicate diffused light"
      };
      const STYLE_NAMES = Object.keys(IMAGE_STYLES);
      const STYLE_LIST_TEXT = STYLE_NAMES.map((n, i) => `${i + 1}. ${n}`).join(" / ");
      const STYLE_RULE_TEXT = `표현 대상의 특성에 따라 위 8개 표현 방식 중 가장 적합한 하나를 직접 고릅니다. 의미뿐 아니라 에너지, 긴장도, 공간감, 시간성, 자연성, 추상성을 함께 고려해 결정합니다. 같은 스타일을 기계적으로 반복하지 않습니다.`;

      const LABEL_LANGS = [
        { id: "en", label: "영문만" },
        { id: "ko", label: "한글 + 영문" }
      ];
      const QUALITIES = [
        { id: "medium", label: "표준" },
        { id: "high",   label: "고품질" }
      ];

      const EMOTION_METHOD = {
        label: "지각·경험 중심 감성디자인",
        en: "Emotion & Perception-centered Design",
        guide: `지각을 곧바로 감성 단어로 바꾸지 않습니다. 먼저 사람이 이 사물을 보고, 가까이 가고, 만지고, 움직이거나 사용하면서 무엇을 감지하고 어떻게 경험하는지 해석합니다. 그 경험이 만드는 정서적 온도, 에너지, 긴장과 이완, 안정감, 활동성, 세련됨, 생동감, 무게감, 친근함, 낯섦과 같은 감성 결과를 구체적으로 정리합니다.`
      };

      const STAGES = [
        { n: 1, label: "사물 입력" },
        { n: 2, label: "물성 분석" },
        { n: 3, label: "지각 분석" },
        { n: 4, label: "감성 분석" }
      ];

      const SAMPLE_OBJECTS = ["나뭇잎", "조약돌", "유리컵", "가죽 지갑", "의자", "조개껍데기", "얼음 조각", "니트 스웨터"];
      const FEATURE_CATEGORIES = ["형태", "구조", "색상", "소재", "표면", "접합·구성", "견고성", "가동·기능", "기타"];
      const OBJECT_KINDS = ["자연물", "인공물", "가공된 자연물"];

      const NO_DATA = "이 항목은 AI 응답에 포함되지 않았습니다. 다시 생성해 보세요.";

      /* =========================================================
         2. PROMPTS — 텍스트
         사물 → 전체 특징 → 물성 → 지각 → 감성 → 감성 키워드
         고정된 CMF 프레임이나 고정 개수에 맞추지 않고 사물 자체에 필요한 항목을 AI가 정합니다.
         각 항목은 앞 단계 항목 번호(from)를 근거로 돌려받아 추적 경로를 보여 줍니다.
         ========================================================= */
      const SYSTEM = `당신은 제품디자인, 사물 관찰, 구조·재료·물성 공학, 지각심리학, 감성디자인, CMF(Color·Material·Finish), Material Experience Research를 함께 다루는 시니어 디자인 리서처입니다.
이 도구는 하나의 사물을 출발점으로 그 사물의 전체적인 특징을 관찰하고, 중요한 물성을 읽어 낸 뒤, 사람이 무엇을 지각하고 최종적으로 어떤 감성을 갖게 되는지를 단계적으로 분석합니다.
- 첫 단계는 CMF만 분석하지 않습니다. 형태, 비례, 구조, 색상, 소재, 표면, 접합, 견고성, 가동부, 기능적 구성 등 사물을 이해하는 데 중요한 특징을 종합적으로 봅니다.
- 물성 단계는 보이는 성질, 만져지는 성질, 움직임, 변형, 저항, 복원, 소리, 온도, 무게, 시간에 따른 변화와 반응을 폭넓게 검토합니다.
- 지각 단계는 순간적인 감지와 사용·접촉을 통해 누적되는 경험적 지각을 함께 다룹니다.
- 감성 단계는 기쁨/슬픔 같은 정서뿐 아니라 활기참, 차분함, 세련됨, 생동감, 안정감, 친근함, 무거움, 긴장감 등 사물을 경험한 뒤 형성되는 감성적 인상을 다룹니다.
- 항목 개수는 고정하지 않습니다. 중요한 차이가 충분히 설명되도록 AI가 사물에 맞는 개수를 결정하되, 중복되거나 의미가 약한 항목은 넣지 않습니다.
- 특정 개인의 취향보다 대부분의 사람이 일상에서 이 사물을 마주할 때 공통으로 겪는 보편적인 상황을 기준으로 분석합니다.
- 각 단계는 가능한 한 앞 단계의 관찰과 분석 결과를 근거로 연결합니다. 사물 이름에 붙은 통념이나 상징으로 건너뛰지 않습니다.
- 모든 한국어 문장은 정중하고 명확한 존댓말로 작성합니다.
- 반드시 요청받은 JSON 객체 하나만 반환합니다. 설명, 머리말, 코드펜스를 붙이지 않습니다.`;

      const listTraits = items => items.map(t =>
        `${t.index}. [${t.category}] ${t.titleKo} (${t.titleEn}) — ${t.observation}`).join("\n");
      const listProperties = items => items.map(p =>
        `${p.index}. [${p.axis}] ${p.titleKo} (${p.titleEn}) · 추정 ${p.level} ${p.value} — ${p.description}`).join("\n");
      const listPerceptions = items => items.map(p =>
        `${p.index}. [${p.moment}] ${p.titleKo} (${p.titleEn}) — ${p.description}`).join("\n");
      const objectHead = o => `분석 사물: ${o.nameKo}${o.nameEn ? ` (${o.nameEn})` : ""} · ${o.kind}\n기준 표본: ${o.specimen || o.summary}`;

      const PROMPTS = {
        OBJECT: (keyword, note, hasPhoto, instruction) => `${hasPhoto
  ? `[입력 방식] 사용자가 사물 사진을 첨부했습니다.${keyword ? ` 사용자가 적은 사물 이름: "${keyword}"` : " 사물 이름은 적지 않았습니다. 사진에서 직접 판별합니다."}`
  : `[입력 방식] 사진 없이 사물 키워드만 입력되었습니다: "${keyword}"`}
${note ? `연관 과제(참고용, 분석 기준은 보편적 상황): ${note}\n` : ""}
[분석 프로세스]
사물 관찰 → 전체 특징 → 물성 → 지각 → 감성 순서로 분석합니다. 지금은 첫 단계인 '사물 특징 분석'입니다.

[목표]
이 사물이 어떤 사물인지 한눈에 이해할 수 있도록 전체적인 특징을 간단하고 정확하게 정리합니다. CMF만 보지 말고 형태와 구조, 색상, 소재, 표면, 접합·구성, 견고성, 가동·기능 등 이 사물의 경험에 영향을 줄 중요한 특징을 모두 검토합니다.
예를 들어 의자라면 등받이·좌판·다리의 구조와 비례, 색상, 사용 소재, 표면 상태, 프레임의 견고함, 쿠션의 두께와 구성, 접합 방식, 움직이거나 조절되는 부위 등을 필요에 따라 포함합니다.

[분석 기준 표본]
- 사진이 있으면 사진 속 개체를 기준으로 합니다. 사진에서 보이지 않는 면은 확정적으로 지어내지 말고 필요하면 '추정'으로 표시합니다.
- 조명 색, 배경, 촬영 각도처럼 촬영 조건에서만 생긴 요소는 사물 고유 특징과 구분합니다.
- 키워드만 있으면 대부분의 사람이 떠올리는 전형적인 표본 하나를 기준으로 정합니다.
- 사진 속 대상이 여러 개면 가장 중심이 되는 하나를 고르고 그 이유를 specimen에 적습니다.
- 사람이 찍혀 있으면 얼굴이나 신원은 분석하지 않고 대상 사물만 분석합니다.

[사물 개요]
- "nameKo", "nameEn": 사물 이름입니다.
- "kind": "자연물", "인공물", "가공된 자연물" 중 가장 가까운 것을 씁니다.
- "summary": 2~3문장. 무엇인지, 전체 형태와 구조적 특징, 눈에 띄는 상태를 간단히 요약합니다.
- "specimen": 1문장. 분석 기준 표본입니다.
- "palette": 대표 색 3~5개. 각 색은 {"hex":"#RRGGBB","name":"한글 색 이름","role":"주조색|보조색|강조색|음영색"}입니다.
- "visual": 기준 표본 전체를 명확하게 보여 주는 영어 이미지 프롬프트 2문장입니다.

[사물의 핵심 특징]
- 고정 개수는 없습니다. 사물을 이해하는 데 중요한 특징을 빠짐없이 담되, 서로 겹치는 항목은 합칩니다. 일반적으로 6~10개가 적절하지만 사물에 따라 더 적거나 많아도 됩니다.
- 다음 범주를 모두 검토하되 해당 사물과 무관한 범주는 억지로 넣지 않습니다: 형태·비례 / 구조·구성 / 색상 / 소재 / 표면·마감 / 접합·디테일 / 견고성·안정성 / 가동·기능 / 기타 중요한 특징.
- "category": 위 내용을 표현하는 짧은 한글 분류명입니다. 예: "형태", "구조", "색상", "소재", "견고성", "가동·기능".
- "titleKo": 특징을 짚는 짧은 명사구입니다.
- "titleEn": 영문명 2~5단어입니다.
- "observation": 1~2문장. 무엇이 어떤 방식으로 구성·형성되어 있는지를 간단히 설명합니다.
- "evidence": 1문장. 사진 입력이면 어느 부위에서, 키워드 입력이면 전형적 표본의 어느 부분에서 확인되는지 적습니다.
- "certainty": 직접 확인 가능한 내용은 "관찰", 구조나 재료 등을 단서로 추론한 내용은 "추정"입니다.
- "visual": 해당 특징이 가장 잘 드러나는 영어 이미지 프롬프트 1~2문장입니다. 전체 형태, 구조 디테일, 표면 확대 등 특징에 맞는 시점을 선택합니다.
- "label"은 2~4단어 영문 제목, "labelKo"는 10자 이내 한글 제목입니다.

[언어 규칙]
- 이 단계에서는 아직 감성 결론을 내리지 않습니다.
- 단순히 '예쁘다/고급스럽다'고 평가하지 말고 관찰 가능한 구성과 특징을 씁니다.
- 브랜드명이나 모델명은 확실하지 않으면 추측하지 않습니다.

Relative intensity: ${Number.isFinite(Number(l.intensity)) ? Math.round(Number(l.intensity)) : 60}/100.
Single-scene direction: ${l.visual}
Translate the emotional quality into one coherent, sophisticated design-magazine scene; do not simply repeat the analysed object, and avoid infographic symbols.`;
        }
      };

      const ITEM_IMAGE_SIZE = { property: "1024x1024", perception: "1024x1024", emotion: "1536x1024" };
      const BOARD_STAGES = {
        property:   { title: "물성 분석", en: "Physical Properties", cols: 2, ratio: 1 },
        perception: { title: "지각 분석", en: "Perception in Experience", cols: 2, ratio: 1 },
        emotion:    { title: "대표 감성", en: "Experience-based Emotions", cols: 1, ratio: 1024 / 1536 }
      };
      const STAGE_LABEL = { property: "물성", perception: "지각", emotion: "대표 감성" };

      function stageItems(stage) {
        if (stage === "property") return state.properties;
        if (stage === "perception") return state.perceptions;
        if (stage === "emotion") return state.emotion && Array.isArray(state.emotion.layers) ? state.emotion.layers : [];
        return [];
      }
      function itemPrompt(stage, item, i) {
        if (stage === "property") return IMG.property(item, state.object);
        if (stage === "perception") return IMG.perception(item, i);
        return IMG.emotion(item, i);
      }
      function itemCaption(stage, it) {
        if (stage === "property") return { ko: it.titleKo, en: it.titleEn, tag: it.axis };
        if (stage === "perception") return { ko: it.titleKo, en: it.titleEn, tag: it.moment };
        return { ko: it.nameKo, en: it.nameEn, tag: it.phase };
      }
      function itemImg(stage, id) {
        const m = state.itemImages && state.itemImages[stage];
        return m && m[id] ? m[id] : null;
      }
      /* 이전 버전(한 장 통합 생성)에서 만든 보드인지 — 이 경우 칸별 교체가 불가능합니다. */
      function isLegacyBoard(stage) {
        return !!(state.images && state.images[stage]) && !(state.boardKind && state.boardKind[stage] === "items");
      }

      /* ---- 캔버스 보드 ---- */
      function loadImg(src) {
        return new Promise(res => {
          if (!src) { res(null); return; }
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => res(null);
          im.src = src;
        });
      }
      /* 생성된 PNG를 JPEG data URL로 줄여 저장 용량을 낮춥니다. */
      async function toJpeg(src, quality) {
        const im = await loadImg(src);
        if (!im || !im.naturalWidth) return src;
        try {
          const cv = document.createElement("canvas");
          cv.width = im.naturalWidth; cv.height = im.naturalHeight;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(im, 0, 0);
          return cv.toDataURL("image/jpeg", quality || 0.88);
        } catch (e) { return src; }
      }
      async function ensureFonts() {
        try {
          if (document.fonts && document.fonts.load) {
            await Promise.all([
              document.fonts.load("800 30px Pretendard"),
              document.fonts.load("700 22px Pretendard"),
              document.fonts.load("400 22px Pretendard")
            ]);
          }
        } catch (e) { /* 시스템 글꼴로 대체 */ }
      }
      function wrapLines(ctx, text, maxW) {
        const out = [];
        let line = "";
        const tokens = String(text || "").split(/(\s+)/).filter(t => t.length);
        for (const tk of tokens) {
          if (ctx.measureText(line + tk).width <= maxW) { line += tk; continue; }
          if (line.trim()) { out.push(line.trim()); line = ""; }
          if (/^\s+$/.test(tk)) continue;
          if (ctx.measureText(tk).width <= maxW) { line = tk; continue; }
          for (const ch of tk) {
            if (line && ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
            else line += ch;
          }
        }
        if (line.trim()) out.push(line.trim());
        return out.length ? out : [""];
      }
      function drawCover(ctx, im, x, y, w, h) {
        const s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
        const sw = w / s, sh = h / s;
        ctx.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
      }

      async function composeBoard(stage) {
        const cfg = BOARD_STAGES[stage];
        const items = stageItems(stage);
        if (!cfg || !items.length) return null;
        await ensureFonts();

        const FONT = "Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
        const W = 1200, M = 56, G = 28, cols = cfg.cols;
        const cellW = Math.floor((W - M * 2 - G * (cols - 1)) / cols);
        const imgH = Math.round(cellW * cfg.ratio);
        const korean = state.labelLang === "ko";
        const PAD = 20;
        const SZ = cols === 1
          ? { tag: 22, title: 34, en: 24 }
          : { tag: 20, title: 28, en: 21 };
        const textW = cellW - PAD * 2;

        const meas = document.createElement("canvas").getContext("2d");
        const caps = items.map((it, i) => {
          const c = itemCaption(stage, it);
          meas.font = `800 ${SZ.title}px ${FONT}`;
          const titleLines = wrapLines(meas, `${pad2(i + 1)}  ${korean ? (c.ko || c.en) : (c.en || c.ko)}`, textW);
          meas.font = `400 ${SZ.en}px ${FONT}`;
          const enLines = korean && c.en ? wrapLines(meas, c.en, textW) : [];
          const h = PAD + (c.tag ? Math.round(SZ.tag * 1.5) + 6 : 0)
            + titleLines.length * Math.round(SZ.title * 1.32)
            + enLines.length * Math.round(SZ.en * 1.45) + PAD;
          return { c, titleLines, enLines, h };
        });

        const HEAD = 150;
        const rowH = [];
        for (let r = 0; r * cols < items.length; r++) {
          rowH.push(imgH + Math.max.apply(null, caps.slice(r * cols, r * cols + cols).map(c => c.h)));
        }
        const H = M + HEAD + rowH.reduce((a, b) => a + b, 0) + G * (rowH.length - 1) + M;

        const cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
        ctx.textBaseline = "top";

        ctx.fillStyle = "#64748b"; ctx.font = `700 20px ${FONT}`;
        ctx.fillText("OBJECT EXPERIENCE LAB", M, M);
        ctx.fillStyle = "#0f172a"; ctx.font = `800 40px ${FONT}`;
        ctx.fillText(cfg.title, M, M + 32);
        ctx.fillStyle = "#64748b"; ctx.font = `400 22px ${FONT}`;
        ctx.fillText(`${objectName() || ""}${objectName() ? "  ·  " : ""}${cfg.en}`, M, M + 86);
        ctx.fillStyle = "#0f172a"; ctx.fillRect(M, M + HEAD - 24, W - M * 2, 3);

        const imgs = await Promise.all(items.map(it => loadImg(itemImg(stage, it.id))));
        let y = M + HEAD;
        for (let r = 0; r < rowH.length; r++) {
          for (let k = 0; k < cols; k++) {
            const i = r * cols + k;
            if (i >= items.length) break;
            const x = M + k * (cellW + G);
            const cap = caps[i];
            ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, cellW, rowH[r]);
            if (imgs[i]) {
              drawCover(ctx, imgs[i], x, y, cellW, imgH);
            } else {
              ctx.fillStyle = "#f1f5f9"; ctx.fillRect(x, y, cellW, imgH);
              ctx.fillStyle = "#94a3b8"; ctx.font = `700 24px ${FONT}`;
              const t = "이미지 없음";
              ctx.fillText(t, x + (cellW - ctx.measureText(t).width) / 2, y + imgH / 2 - 12);
            }
            let ty = y + imgH + PAD;
            if (cap.c.tag) {
              ctx.fillStyle = "#0f766e"; ctx.font = `700 ${SZ.tag}px ${FONT}`;
              ctx.fillText(cap.c.tag, x + PAD, ty);
              ty += Math.round(SZ.tag * 1.5) + 6;
            }
            ctx.fillStyle = "#0f172a"; ctx.font = `800 ${SZ.title}px ${FONT}`;
            cap.titleLines.forEach(l => { ctx.fillText(l, x + PAD, ty); ty += Math.round(SZ.title * 1.32); });
            ctx.fillStyle = "#64748b"; ctx.font = `400 ${SZ.en}px ${FONT}`;
            cap.enLines.forEach(l => { ctx.fillText(l, x + PAD, ty); ty += Math.round(SZ.en * 1.45); });
            ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 2;
            ctx.strokeRect(x + 1, y + 1, cellW - 2, rowH[r] - 2);
          }
          y += rowH[r] + G;
        }
        return cv.toDataURL("image/jpeg", 0.9);
      }

      /* =========================================================
         4. 유틸 — 이스케이프 / 토스트 / ID
         ========================================================= */
      let uidSeq = 0;
      const uid = p => `${p}_${Date.now().toString(36)}_${(uidSeq++).toString(36)}`;

      function esc(v) {
        return String(v === null || v === undefined ? "" : v)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      const escAttr = esc;

      const nowLabel = t => new Date(t).toLocaleString("ko-KR", {
        year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });

      let toastTimer = null;
      function toast(msg, kind) {
        const region = document.getElementById("toast-region");
        if (region) region.textContent = msg;
        let el = document.getElementById("toast-visual");
        if (!el) {
          el = document.createElement("div");
          el.id = "toast-visual";
          document.body.appendChild(el);
        }
        el.className = "fixed left-1/2 -translate-x-1/2 bottom-[calc(28px+env(safe-area-inset-bottom))] z-[10050] px-5 py-3.5 rounded-2xl shadow-2xl t-small font-bold text-white max-w-[92vw] text-center " +
          (kind === "error" ? "bg-red-700" : "bg-slate-900");
        el.textContent = msg;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 3200);
      }

      /* =========================================================
         5. 저장소 — 프로젝트 텍스트는 localStorage, 이미지는 IndexedDB
         저장 공간이 부족하면 가장 오래된 프로젝트부터 지워 공간을 확보합니다.
         ========================================================= */
      const BOARD_SLOTS = ["source", "property", "perception", "emotion"];
      const blankImages = () => ({ source: null, property: null, perception: null, emotion: null });
      const blankItemImages = () => ({ property: {}, perception: {}, emotion: {} });

      /* ---------------------------------------------------------
         저장 방식 — '감성 · 지각 · 인터랙션 컨셉 랩 v12.10'과 같은 방식입니다.
         · 프로젝트 글(분석 내용)은 localStorage에 목록으로 저장합니다. (최대 5개)
         · 이미지는 IndexedDB 'images' 저장소에 data URL 문자열로 저장합니다.
           키는 `프로젝트id::슬롯` 입니다. (보드: property / perception / emotion / source,
           항목별 이미지: item::단계::항목id)
         --------------------------------------------------------- */
      let imageDbPromise = null;
      const ImageDB = {
        open() {
          if (!("indexedDB" in window) || !window.indexedDB) return Promise.reject(new Error("IDB_UNAVAILABLE"));
          if (imageDbPromise) return imageDbPromise;
          imageDbPromise = new Promise((res, rej) => {
            /* v5~v7이 이 DB를 버전 2로 올려 두었기 때문에 같은 버전으로 엽니다. */
            const req = indexedDB.open(CONFIG.IMAGE_DB.name, 2);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(CONFIG.IMAGE_DB.store)) {
                db.createObjectStore(CONFIG.IMAGE_DB.store, { keyPath: "id" });
              }
            };
            req.onsuccess = () => {
              const db = req.result;
              db.onversionchange = () => { try { db.close(); } catch (e) { /* 무시 */ } imageDbPromise = null; };
              res(db);
            };
            req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
          });
          imageDbPromise.catch(() => { imageDbPromise = null; });
          return imageDbPromise;
        },
        _act(mode, fn, storeName) {
          const name = storeName || CONFIG.IMAGE_DB.store;
          return ImageDB.open().then(db => new Promise((res, rej) => {
            const tx = db.transaction(name, mode);
            const rq = fn(tx.objectStore(name));
            rq.onsuccess = () => res(rq.result);
            rq.onerror = () => rej(rq.error || new Error("IDB_REQUEST_FAILED"));
          }));
        },
        key: (projectId, slot) => `${projectId}::${slot}`,
        range: prefix => IDBKeyRange.bound(prefix, prefix + " "),
        async put(projectId, slot, dataUrl) {
          try {
            await ImageDB._act("readwrite", st => st.put({
              id: ImageDB.key(projectId, slot), projectId, slot, dataUrl, savedAt: Date.now()
            }));
            return true;
          } catch (e) { console.warn("이미지 저장 실패", slot, e); return false; }
        },
        async get(projectId, slot) {
          try {
            const row = await ImageDB._act("readonly", st => st.get(ImageDB.key(projectId, slot)));
            return row ? await rowDataUrl(row) : null;
          } catch (e) { return null; }
        },
        /* 프로젝트의 보드 이미지와 항목별 이미지를 모두 읽어 옵니다. */
        async loadAll(projectId) {
          const images = blankImages();
          const itemImages = blankItemImages();
          let failed = false;
          try {
            const prefix = `${projectId}::`;
            const rows = await ImageDB._act("readonly", st => st.getAll(ImageDB.range(prefix)));
            for (const row of (rows || [])) {
              const url = await rowDataUrl(row);
              if (!url) continue;
              const slot = String(row.id).slice(prefix.length);
              if (slot.indexOf("item::") === 0) {
                const parts = slot.split("::");
                if (itemImages[parts[1]]) itemImages[parts[1]][parts.slice(2).join("::")] = url;
              } else if (BOARD_SLOTS.includes(slot)) {
                images[slot] = url;
              }
            }
          } catch (e) {
            console.warn("이미지를 불러오지 못했습니다.", e);
            failed = true;
          }
          return { images, itemImages, failed };
        },
        async remove(projectId, slot) {
          try { await ImageDB._act("readwrite", st => st.delete(ImageDB.key(projectId, slot))); return true; }
          catch (e) { console.warn("이미지 삭제 실패", slot, e); return false; }
        },
        async removePrefix(prefix) {
          try { await ImageDB._act("readwrite", st => st.delete(ImageDB.range(prefix))); return true; }
          catch (e) { return false; }
        },
        removeProject(projectId) {
          return ImageDB.removePrefix(`${projectId}::`);
        }
      };

      /* v5~v7은 이미지를 Blob/바이트 배열로 저장했습니다. 읽을 때 data URL로 바꾸고 그 형식으로 다시 저장합니다. */
      function readAsDataUrl(blob) {
        return new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.onerror = () => rej(fr.error || new Error("READ_FAILED"));
          fr.readAsDataURL(blob);
        });
      }
      async function rowDataUrl(row) {
        if (!row) return null;
        if (typeof row.dataUrl === "string" && row.dataUrl.indexOf("data:") === 0) return row.dataUrl;
        let blob = null;
        if (row.buf && row.buf.byteLength) blob = new Blob([row.buf], { type: row.type || "image/jpeg" });
        else if (row.blob && row.blob.size) blob = row.blob;
        if (!blob) return null;
        try {
          const dataUrl = await readAsDataUrl(blob);
          if (typeof dataUrl !== "string" || dataUrl.indexOf("data:") !== 0) return null;
          ImageDB._act("readwrite", st => st.put({
            id: row.id, projectId: row.projectId, slot: row.slot, dataUrl, savedAt: row.savedAt || Date.now()
          })).catch(() => {});
          return dataUrl;
        } catch (e) {
          console.warn("이전 형식 이미지를 읽지 못했습니다.", row.id, e);
          return null;
        }
      }

      const Store = {
        list() {
          try {
            const raw = localStorage.getItem(CONFIG.PROJECTS_KEY);
            const list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) {
            console.warn("저장 목록을 읽지 못했습니다.", e);
            return [];
          }
        },
        _write(list) {
          try { localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(list)); return true; }
          catch (e) { return false; }
        },
        save(snap, meta) {
          let list = Store.list().filter(p => p.id !== meta.id);
          list.unshift({ id: meta.id, title: meta.title, savedAt: Date.now(), data: snap });
          if (list.length > CONFIG.MAX_PROJECTS) {
            list.slice(CONFIG.MAX_PROJECTS).forEach(p => ImageDB.removeProject(p.id));
            list = list.slice(0, CONFIG.MAX_PROJECTS);
          }
          if (Store._write(list)) return { ok: true };
          /* 공간이 부족하면 가장 오래된 프로젝트부터 하나씩 지우며 다시 저장합니다. */
          let reduced = list.slice();
          while (reduced.length > 1) {
            reduced = reduced.slice(0, reduced.length - 1);
            if (Store._write(reduced)) {
              list.slice(reduced.length).forEach(p => ImageDB.removeProject(p.id));
              return { ok: true, pruned: list.length - reduced.length };
            }
          }
          return { ok: false };
        },
        remove(id) {
          ImageDB.removeProject(id);
          return Store._write(Store.list().filter(p => p.id !== id));
        },
        /* v5~v7이 IndexedDB 'projects' 저장소에 둔 프로젝트를 localStorage 목록으로 되돌립니다. */
        async migrateFromIdb() {
          try {
            const db = await ImageDB.open();
            if (!db.objectStoreNames.contains("projects")) return false;
            const rows = await ImageDB._act("readonly", st => st.getAll(), "projects");
            if (!rows || !rows.length) return false;
            const have = new Set(Store.list().map(p => p.id));
            const add = rows.filter(r => r && r.id && r.data && !have.has(r.id))
              .map(r => ({ id: r.id, title: r.title || "이름 없는 프로젝트", savedAt: r.savedAt || Date.now(), data: r.data }));
            if (!add.length) { await ImageDB._act("readwrite", st => st.clear(), "projects"); return false; }
            const list = Store.list().concat(add).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).slice(0, CONFIG.MAX_PROJECTS);
            if (Store._write(list)) {
              await ImageDB._act("readwrite", st => st.clear(), "projects");
              return true;
            }
          } catch (e) { console.warn("이전 프로젝트를 옮기지 못했습니다.", e); }
          return false;
        }
      };

      /* =========================================================
         6. STATE
         ========================================================= */
      function blankProject() {
        return {
          projectId: uid("proj"),
          keyword: "",
          note: "",
          hasPhoto: false,
          object: null,
          traits: [],
          properties: [],
          perceptions: [],
          emotion: null,
          images: blankImages(),
          itemImages: blankItemImages(),
          boardKind: {},
          editSel: {},
          imagesLoading: false,
          createdAt: Date.now()
        };
      }

      const state = Object.assign({
        apiKey: "",
        quality: QUALITIES[0].id,
        labelLang: "ko",
        step: -1,
        isAnalyzing: false,
        loadingMsg: "",
        errorMsg: null,
        lightbox: null,
        settingsOpen: false
      }, blankProject());

      const drafts = {};
      const draft = id => (drafts[id] === undefined ? "" : drafts[id]);

      window.setDraft = setDraft;

      /* =========================================================
         7. 세션 — API 키와 모델 설정은 이 브라우저 세션에만 보관
         ========================================================= */
      function loadSession() {
        try {
          state.apiKey = sessionStorage.getItem(CONFIG.SESSION_KEY_API) || "";
          sessionStorage.removeItem(CONFIG.SESSION_KEY_PREFS);
          /* 이미지 품질은 '표준', 라벨은 '한글 + 영문'으로 고정합니다. */
          state.quality = "medium";
          state.labelLang = "ko";

      /* =========================================================
         8. OpenAI 호출 — 모델 고정: 분석 GPT-5.6 Terra / 이미지 Image 2.5 Flare
         텍스트 분석은 Responses API — 사진이 있으면 input_image로 함께 보냅니다.
         파라미터를 지원하지 않는 모델을 만나면 옵션을 하나씩 덜어내며 재시도합니다.
         ========================================================= */
      let activeController = null;
      /* 한 작업(withLoading) 안의 모든 요청이 같은 취소 신호를 씁니다. 취소 버튼 하나로 동시 요청이 함께 멈춥니다. */
      function currentController() {
        if (!activeController) activeController = new AbortController();
        return activeController;
      }

      function parseModelJson(text) {
        let t = String(text || "").trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 구간 추출 재시도 */ }
        const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
        const first = starts.length ? Math.min.apply(null, starts) : -1;
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (first >= 0 && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      function extractOutputText(data) {
        if (data && typeof data.output_text === "string" && data.output_text.trim()) return data.output_text;
        const out = (data && Array.isArray(data.output)) ? data.output : [];
        const parts = [];
        out.forEach(item => {
          if (item && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if (c && typeof c.text === "string" && (c.type === "output_text" || c.type === "text")) parts.push(c.text);
            });
          }
        });
        return parts.join("\n");
      }

      function httpMessage(status, payload) {
        const detail = payload && payload.error && payload.error.message ? payload.error.message : "";
        if (status === 401 || status === 403) return "API 키가 유효하지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.";
        if (status === 404) return `이 API 키로는 ${CONFIG.TEXT_MODEL_LABEL} 또는 ${CONFIG.IMAGE_MODEL_LABEL}를 쓸 수 없습니다. OpenAI 계정의 모델 접근 권한을 확인해 주세요.${detail ? " (" + detail + ")" : ""}`;
        if (status === 429) return "요청이 너무 많거나 사용 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.";
        if (status === 400) return detail || "요청 형식이 거부되었습니다.";
        return `요청이 거부되었습니다 (상태 ${status}).${detail ? " " + detail : ""}`;
      }

      async function postJson(path, body, controller) {
        const res = await fetch(CONFIG.API_BASE + path, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${state.apiKey || ""}`
          },
          body: JSON.stringify(body)
        });
        let payload = null;
        try { payload = await res.json(); } catch (e) { payload = null; }
        if (!res.ok) {
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403].includes(res.status);
          err.paramIssue = res.status === 400 || res.status === 404;
          throw err;
        }
        return payload;
      }

      async function callText(systemPrompt, userPrompt, photoDataUrl) {
        const controller = currentController();

        const userContent = photoDataUrl
          ? [{ type: "input_text", text: userPrompt }, { type: "input_image", image_url: photoDataUrl, detail: "high" }]
          : userPrompt;
        const input = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userContent }
        ];
        const variants = [
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 12000, reasoning: { effort: "low" } },
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 12000 },
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } } },
          { model: CONFIG.TEXT_MODEL, input }
        ];

        const delays = [900, 2200, 5000];
        let lastError = "알 수 없는 오류가 발생했습니다.";
        let lastStatus = 0;
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/responses", variants[vi], controller);
            if (data && data.status === "incomplete") {
              throw new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택 항목을 줄이고 다시 시도해 주세요.");
            }
            const text = extractOutputText(data);
            if (!text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
            return parseModelJson(text);
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            lastStatus = err.status || 0;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        if (photoDataUrl && lastStatus === 400 && /image/i.test(lastError)) {
          throw new Error(`${CONFIG.TEXT_MODEL_LABEL}가 이 사진 입력을 받지 않았습니다. 사진을 빼고 사물 키워드로 분석해 주세요.`);
        }
        const fail = new Error(lastError);
        fail.fatal = lastStatus === 401 || lastStatus === 403;
        throw fail;
      }

      async function callImage(prompt, size) {
        const controller = currentController();
        const sz = size || CONFIG.IMAGE_SIZE;

        const variants = [
          { model: CONFIG.IMAGE_MODEL, prompt, size: sz, quality: state.quality },
          { model: CONFIG.IMAGE_MODEL, prompt, size: sz },
          { model: CONFIG.IMAGE_MODEL, prompt }
        ];
        /* 동시에 여러 장을 만들 때 429(요청 과다)가 날 수 있어 대기를 넉넉히 둡니다. */
        const delays = [2000, 5000, 10000];
        let lastError = "이미지를 생성하지 못했습니다.";
        let lastFatal = false;
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/images/generations", variants[vi], controller);
            const first = data && Array.isArray(data.data) ? data.data[0] : null;
            if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
            if (first && first.url) return first.url;
            throw new Error("이미지 응답이 비어 있습니다. 다시 시도해 주세요.");
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) { lastFatal = true; break; }
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        const fail = new Error(lastError);
        fail.fatal = lastFatal;
        throw fail;
      }

      async function withLoading(msg, fn) {
        activeController = new AbortController();
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("작업을 취소했습니다."); return null; }
          console.error(err);
          if (err && err.fatal) {
            persist(false);
            setState({ isAnalyzing: false, step: -1, errorMsg: err.message || "API 키를 다시 확인해 주세요." }, true);
            return null;
          }
          setState({ isAnalyzing: false, errorMsg: err.message || "처리에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      /* =========================================================
         8-B. 사진 준비 — 긴 변 1280px JPEG로 줄여 전송량과 저장 용량을 낮춥니다.
         투명 PNG는 흰 바탕에 올려 검게 변하지 않게 합니다.
         ========================================================= */
      function preparePhoto(file) {
        return new Promise((resolve, reject) => {
          if (!file) { reject(new Error("사진을 찾지 못했습니다.")); return; }
          if (file.type && !/^image\//.test(file.type)) { reject(new Error("사진 파일만 올릴 수 있습니다.")); return; }
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            try {
              const w0 = img.naturalWidth, h0 = img.naturalHeight;
              if (!w0 || !h0) throw new Error("사진 크기를 읽지 못했습니다. 다른 사진으로 시도해 주세요.");
              const scale = Math.min(1, CONFIG.PHOTO_MAX_EDGE / Math.max(w0, h0));
              const w = Math.max(1, Math.round(w0 * scale));
              const h = Math.max(1, Math.round(h0 * scale));
              const cv = document.createElement("canvas");
              cv.width = w; cv.height = h;
              const ctx = cv.getContext("2d");
              if (!ctx) throw new Error("이 브라우저에서는 사진을 처리할 수 없습니다.");
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              resolve(cv.toDataURL("image/jpeg", CONFIG.PHOTO_QUALITY));
            } catch (e) {
              reject(e instanceof Error ? e : new Error("사진을 처리하지 못했습니다."));
            } finally {
              URL.revokeObjectURL(url);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("이 사진 형식은 열 수 없습니다. JPG나 PNG로 바꿔 다시 올려 주세요."));
          };
          img.src = url;
        });
      }

      /* =========================================================
         9. 응답 정규화 — 필드가 빠져도 화면이 죽지 않도록 방어
         ========================================================= */
      const str = v => (typeof v === "string" ? v.trim() : (v === null || v === undefined ? "" : String(v)));
      const arr = v => (Array.isArray(v) ? v : []);

      function matchStyle(raw, i) {
        const want = str(raw).toLowerCase();
        if (want) {
          const exact = STYLE_NAMES.find(n => n.toLowerCase() === want);
          if (exact) return exact;
          const partial = STYLE_NAMES.find(n => n.toLowerCase().includes(want) || want.includes(n.toLowerCase()));
          if (partial) return partial;
        }
        return STYLE_NAMES[i % STYLE_NAMES.length];
      }

      function normHex(v) {
        let s = str(v);
        if (!s) return "";
        if (s[0] !== "#") s = "#" + s;
        if (/^#[0-9a-f]{6}$/i.test(s)) return s.toUpperCase();
        if (/^#[0-9a-f]{3}$/i.test(s)) return ("#" + s.slice(1).split("").map(c => c + c).join("")).toUpperCase();
        return "";
      }

      /* AI가 돌려준 근거 번호(앞 단계 목록 번호, 1부터)를 실제 항목 id로 바꿉니다. */
      function mapFrom(list, source) {
        const ids = arr(list).map(n => {
          const k = Math.round(Number(n));
          return (k >= 1 && k <= source.length) ? source[k - 1].id : null;
        }).filter(Boolean);
        return Array.from(new Set(ids));
      }

      function clampValue(raw, level) {
        const n = Number(raw);
        if (raw !== "" && raw !== null && raw !== undefined && Number.isFinite(n)) return Math.max(2, Math.min(98, Math.round(n)));
        const map = { "낮음": 22, "중간": 55, "높음": 84 };
        return map[str(level)] || 55;
      }
      function levelFromValue(v) { return v < 38 ? "낮음" : (v > 68 ? "높음" : "중간"); }

      function normObject(raw, keyword) {
        const o = raw && raw.object && typeof raw.object === "object" ? raw.object : {};
        const kind = str(o.kind);
        const nameKo = str(o.nameKo) || keyword || "사진 속 사물";
        return {
          nameKo,
          nameEn: str(o.nameEn),
          kind: OBJECT_KINDS.includes(kind) ? kind : (kind || "사물"),
          summary: str(o.summary) || NO_DATA,
          specimen: str(o.specimen),
          palette: arr(o.palette).map(p => ({
            hex: normHex(p && p.hex), name: str(p && p.name), role: str(p && p.role)
          })).filter(p => p.hex).slice(0, 5),
          visual: str(o.visual) || `a clear studio photograph of a single ${str(o.nameEn) || "object"} on a neutral background in soft diffused light`
        };
      }

      /* 사물 특징은 AI가 정한 중요도 순서를 유지합니다. category가 없으면 구버전 cmf 값을 받아 호환합니다. */
      function normTraits(raw) {
        return arr(raw && raw.traits).slice(0, 14).map((t, i) => {
          const categoryRaw = str(t && (t.category || t.cmf));
          const category = categoryRaw || FEATURE_CATEGORIES[i % FEATURE_CATEGORIES.length];
          return {
            id: uid("trt"),
            index: i + 1,
            category,
            cmf: category,
            titleKo: str(t && t.titleKo) || `사물 특징 ${i + 1}`,
            titleEn: str(t && t.titleEn) || `Object Feature ${i + 1}`,
            observation: str(t && t.observation) || NO_DATA,
            evidence: str(t && t.evidence),
            certainty: str(t && t.certainty) === "추정" ? "추정" : "관찰",
            visual: str(t && t.visual) || "an editorial object-analysis image that clearly shows this structural, formal, material or functional characteristic",
            label: str(t && t.label) || str(t && t.titleEn) || `Feature ${i + 1}`,
            labelKo: str(t && t.labelKo) || str(t && t.titleKo) || `특징 ${i + 1}`
          };
        });
      }

      function normProperty(p, i, traits) {
        p = p && typeof p === "object" ? p : {};
        const levels = ["낮음", "중간", "높음"];
        const value = clampValue(p.value, p.level);
        return {
          id: uid("prp"),
          index: i + 1,
          axis: str(p.axis) || "물성",
          titleKo: str(p.titleKo) || `물성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Property ${i + 1}`,
          description: str(p.description) || NO_DATA,
          fromIds: mapFrom(p.from, traits),
          measure: str(p.measure),
          value,
          level: levels.includes(str(p.level)) ? str(p.level) : levelFromValue(value),
          visual: str(p.visual) || "a professional editorial close-up that expresses this property through surface, light, depth or texture"
        };
      }
      function normProperties(raw, traits) {
        return arr(raw && raw.properties).slice(0, 14).map((p, i) => normProperty(p, i, traits));
      }

      /* 지각 개수와 맥락은 AI가 사물에 맞게 결정합니다. */
      function normPerception(p, i, props) {
        p = p && typeof p === "object" ? p : {};
        return {
          id: uid("prc"),
          index: i + 1,
          moment: str(p.moment || p.category) || "지각",
          situation: str(p.situation),
          titleKo: str(p.titleKo) || `지각 ${i + 1}`,
          titleEn: str(p.titleEn) || `Perception ${i + 1}`,
          description: str(p.description) || NO_DATA,
          fromIds: mapFrom(p.from, props),
          cue: str(p.cue),
          visual: str(p.visual) || "a single everyday scene that clearly demonstrates this perception",
          label: str(p.label) || str(p.titleEn) || `Perception ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo) || `지각 ${i + 1}`,
          style: matchStyle(p.style, i)
        };
      }
      function normPerceptions(raw, props) {
        return arr(raw && raw.perceptions).slice(0, 14).map((p, i) => normPerception(p, i, props));
      }

      function normLayer(l, i, percs) {
        l = l && typeof l === "object" ? l : {};
        const n = Number(l.intensity);
        return {
          id: uid("emo"),
          index: i + 1,
          phase: str(l.category || l.phase) || "감성",
          nameKo: str(l.nameKo) || `감성 ${i + 1}`,
          nameEn: str(l.nameEn) || `Emotion ${i + 1}`,
          description: str(l.description) || NO_DATA,
          fromIds: mapFrom(l.from, percs),
          intensity: Number.isFinite(n) && l.intensity !== "" && l.intensity !== null ? Math.max(0, Math.min(100, Math.round(n))) : 60,
          visual: str(l.visual) || "a refined single-scene visual metaphor for this emotional quality",
          label: str(l.label) || str(l.nameEn) || `Emotion ${i + 1}`,
          labelKo: str(l.labelKo) || str(l.nameKo) || `감성 ${i + 1}`,
          style: matchStyle(l.style, i)
        };
      }
      function normEmotion(raw, percs) {
        const e = raw && raw.emotion && typeof raw.emotion === "object" ? raw.emotion : null;
        if (!e) return null;
        const rawItems = (arr(e.emotions).length ? arr(e.emotions) : arr(e.layers)).slice();
        rawItems.sort((a, b) => (Number(b && b.intensity) || 0) - (Number(a && a.intensity) || 0));
        const layers = rawItems.slice(0, 2).map((l, i) => normLayer(l, i, percs));
        if (!layers.length) return null;
        return {
          nameKo: str(e.nameKo) || "종합 감성",
          nameEn: str(e.nameEn) || "Overall Emotion",
          definition: str(e.summary || e.definition) || NO_DATA,
          moodWords: arr(e.moodWords).map(w => str(w)).filter(Boolean).slice(0, 10),
          trace: str(e.trace),
          layers
        };
      }

      /* 개별 수정 응답에서 항목 하나를 꺼냅니다. 모델이 형식을 조금 어겨도 받아 냅니다. */
      function pickEditedItem(data) {
        if (!data || typeof data !== "object") return null;
        if (data.item && typeof data.item === "object") return data.item;
        if (Array.isArray(data.properties) && data.properties[0]) return data.properties[0];
        if (Array.isArray(data.perceptions) && data.perceptions[0]) return data.perceptions[0];
        if (data.emotion && Array.isArray(data.emotion.emotions) && data.emotion.emotions[0]) return data.emotion.emotions[0];
        if (Array.isArray(data.emotions) && data.emotions[0]) return data.emotions[0];
        if (data.titleKo || data.nameKo) return data;
        return null;
      }
      function idsToNums(ids, list) {
        const set = new Set(ids || []);
        return list.map((x, i) => (set.has(x.id) ? i + 1 : null)).filter(Boolean);
      }

      /* =========================================================
         10. 단계 이동 규칙 — 데이터가 준비된 단계까지만 이동
         ========================================================= */
      function stepReady(n) {
        switch (n) {
          case 1: return true;
          case 2: return state.properties.length > 0;
          case 3: return state.perceptions.length > 0;
          case 4: return !!state.emotion;
          default: return false;
        }
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      /* 홈으로 나가며 저장할 때 step이 0이 되어 1로 기록되지 않도록
         마지막으로 작업하던 단계를 따로 기억해 둡니다. */
      let lastWorkStep = 1;

      function snapshot() {
        return {
          projectId: state.projectId,
          keyword: state.keyword,
          note: state.note,
          hasPhoto: !!state.images.source,
          object: state.object,
          traits: state.traits,
          properties: state.properties,
          perceptions: state.perceptions,
          emotion: state.emotion,
          boardKind: state.boardKind,
          createdAt: state.createdAt,
          step: Math.min(4, Math.max(1, state.step >= 1 ? state.step : lastWorkStep))
        };
      }

      function hasContent() {
        return !!(state.keyword || state.object || state.images.source || state.traits.length);
      }

      function objectName() {
        if (state.object && state.object.nameKo) return state.object.nameKo;
        if (state.keyword) return state.keyword;
        return state.images.source ? "사진 속 사물" : "";
      }

      function projectTitle() {
        const name = objectName();
        const emo = state.emotion && state.emotion.layers && state.emotion.layers[0] ? state.emotion.layers[0].nameKo : "";
        if (name && emo) return `${name} · ${emo}`;
        return name || "이름 없는 프로젝트";
      }

      let quotaWarned = false;
      let lastSavedJson = "";
      function persist(showToast) {
        if (!hasContent()) return "empty";
        const snap = snapshot();
        const sig = JSON.stringify(snap) + "|" + projectTitle();
        if (sig === lastSavedJson && !showToast) return "ok";
        const r = Store.save(snap, { id: state.projectId, title: projectTitle() });
        if (r.ok) {
          lastSavedJson = sig;
          quotaWarned = false;
          if (showToast) toast("진행 상태를 저장했습니다.");
          if (r.pruned) toast("저장 공간이 부족해 가장 오래된 프로젝트를 정리했습니다.");
          return "ok";
        }
        if (!quotaWarned) {
          quotaWarned = true;
          toast("저장 공간이 부족해 자동 저장이 중단되었습니다. 리포트를 PDF로 내려받아 주세요.", "error");
        }
        return "full";
      }

      /* 이미지를 IndexedDB에 data URL 문자열로 저장합니다. */
      let imageSaveWarned = false;
      async function storeImage(slot, dataUrl) {
        const ok = await ImageDB.put(state.projectId, slot, dataUrl);
        if (!ok && !imageSaveWarned) {
          imageSaveWarned = true;
          toast("이미지를 브라우저에 저장하지 못했습니다. 화면의 이미지는 남아 있으니 필요하면 내려받아 두세요.", "error");
        }
        return ok;
      }

      /* 다시 생성하면 해당 단계의 보드와 항목별 이미지를 화면과 저장소 양쪽에서 함께 지웁니다.
         화면에서만 지우면 프로젝트를 다시 열 때 옛 이미지가 되살아납니다. */
      function clearStages(stages) {
        const images = Object.assign({}, state.images);
        const items = Object.assign(blankItemImages(), state.itemImages);
        const kinds = Object.assign({}, state.boardKind);
        stages.forEach(s => {
          images[s] = null;
          items[s] = {};
          delete kinds[s];
          ImageDB.remove(state.projectId, s);
          ImageDB.removePrefix(`${state.projectId}::item::${s}::`);
        });
        state.images = images;
        state.itemImages = items;
        state.boardKind = kinds;
      }

      async function setItemImage(stage, id, dataUrl) {
        const items = Object.assign(blankItemImages(), state.itemImages);
        items[stage] = Object.assign({}, items[stage], { [id]: dataUrl });
        state.itemImages = items;
        await storeImage(`item::${stage}::${id}`, dataUrl);
      }
      async function removeItemImage(stage, id) {
        const items = Object.assign(blankItemImages(), state.itemImages);
        items[stage] = Object.assign({}, items[stage]);
        delete items[stage][id];
        state.itemImages = items;
        await ImageDB.remove(state.projectId, `item::${stage}::${id}`);
      }

      /* 항목별 이미지 생성 — 동시에 3장씩 만듭니다. 일부가 실패해도 성공한 것은 남깁니다. */
      async function generateItemImages(stage, jobs, onProgress) {
        const queue = jobs.slice();
        const pid = state.projectId;
        let done = 0, failed = 0, lastErr = "", fatal = false;
        const worker = async () => {
          while (queue.length) {
            const job = queue.shift();
            try {
              const raw = await callImage(itemPrompt(stage, job.item, job.i), ITEM_IMAGE_SIZE[stage]);
              const jpg = await toJpeg(raw, 0.88);
              /* 생성 도중 다른 프로젝트로 바뀌었거나 항목이 다시 생성되었으면 버립니다. */
              if (state.projectId === pid && stageItems(stage).some(it => it.id === job.item.id)) {
                await setItemImage(stage, job.item.id, jpg);
              }
            } catch (err) {
              if (err && err.aborted) { queue.length = 0; throw err; }
              failed += 1;
              lastErr = err && err.message ? err.message : "";
              if (err && err.fatal) { failed += queue.length; queue.length = 0; fatal = true; }
            }
            done += 1;
            if (onProgress) onProgress(done);
          }
        };
        await Promise.all(Array.from({ length: Math.min(3, jobs.length) }, worker));
        return { failed, lastErr, fatal };
      }

      async function rebuildBoard(stage) {
        const board = await composeBoard(stage);
        if (!board) return;
        state.images = Object.assign({}, state.images, { [stage]: board });
        state.boardKind = Object.assign({}, state.boardKind, { [stage]: "items" });
        await storeImage(stage, board);
      }

      /* =========================================================
         12. 렌더 헬퍼
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const nextN = state.step + 1;
        const showNext = STAGES.some(s => s.n === nextN) && stepReady(nextN);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-700">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${nextN}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="Actions.copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="Actions.goHome()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-2 bg-slate-300 rounded-full flex-1 overflow-hidden"><div class="h-full bg-teal-700 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-600 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-5 dock bg-white max-w-[430px] mx-auto z-[60]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none shadow-lg active:scale-[0.98] disabled:active:scale-100 transition-all">${esc(label)}</button>`;
      }

      function secondaryBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="w-full py-4 rounded-2xl font-bold t-small text-slate-700 bg-white border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">${icon ? `<i data-lucide="${icon}" class="w-5 h-5"></i>` : ""}${esc(label)}</button>`;
      }

      function ghostBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="px-4 py-2.5 rounded-xl font-bold t-meta text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 transition-all inline-flex items-center gap-1.5 flex-shrink-0">${icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : ""}${esc(label)}</button>`;
      }

      /* 분석 결과 카드 — 선택 기능 없이 읽기 전용으로 보여 줍니다. */
      function infoCard(opts) {
        const badge = opts.badge
          ? `<span class="t-meta font-bold px-2.5 py-1 rounded-lg flex-shrink-0 bg-slate-200 text-slate-700">${esc(opts.badge)}</span>`
          : "";
        return `<article class="w-full p-5 rounded-[2rem] border-2 border-slate-200 bg-white shadow-md">
          <div class="flex items-start gap-3 mb-3">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums bg-slate-900 text-white">${esc(pad2(opts.index))}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(opts.title)}</h3>
              ${opts.subtitle ? `<p class="t-meta text-slate-500">${esc(opts.subtitle)}</p>` : ""}
            </div>
            ${badge}
          </div>
          <div class="space-y-2">${opts.body || ""}</div>
        </article>`;
      }

      function chip(text, tone) {
        const cls = tone === "accent"
          ? "bg-teal-50 text-teal-800 border-teal-200"
          : "bg-slate-100 text-slate-700 border-slate-200";
        return `<span class="inline-block t-meta px-2.5 py-1 rounded-lg border ${cls}">${esc(text)}</span>`;
      }

      function imageCard(slot, opts) {
        const url = state.images ? state.images[slot] : null;
        const items = stageItems(slot);
        const legacy = isLegacyBoard(slot);
        const missing = items.filter(it => !itemImg(slot, it.id)).length;
        const inner = !url && state.imagesLoading
          ? `<div class="w-full rounded-2xl bg-slate-100 px-5 py-12 text-center t-small text-slate-500">저장된 이미지를 불러오고 있습니다…</div>`
          : url
          ? `<button type="button" onclick="Actions.openLightbox('${slot}')" class="block w-full" aria-label="${escAttr(opts.title)} 크게 보기">
               <img src="${escAttr(url)}" alt="${escAttr(opts.alt || "생성된 통합 이미지")}" class="w-full rounded-2xl bg-slate-100" />
             </button>`
          : `<div class="w-full rounded-2xl bg-slate-100 border-2 border-dashed border-slate-300 px-5 py-10 text-center">
               <i data-lucide="image" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
               <p class="t-small text-slate-600 mb-4">${esc(opts.empty || "아직 이미지를 만들지 않았습니다.")}</p>
               ${items.length ? ghostBtn(missing && missing < items.length ? `빠진 이미지 ${missing}개 만들기` : "이미지 만들기", `Actions.buildMissing('${slot}')`, "image-plus") : ""}
             </div>`;
        let repair = "";
        if (url && !legacy && missing) {
          repair = `<div class="mt-3 px-1">${ghostBtn(`빠진 이미지 ${missing}개 만들기`, `Actions.buildMissing('${slot}')`, "image-plus")}</div>`;
        }
        return `<section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <h3 class="t-label text-slate-500">${esc(opts.title)}</h3>
            ${url ? ghostBtn("이미지 저장", `Actions.downloadImage('${slot}')`, "download") : ""}
          </div>
          ${inner}
          ${repair}
          ${opts.caption ? `<p class="t-meta text-slate-500 mt-3 px-1 prose-ko">${esc(opts.caption)}</p>` : ""}
        </section>`;
      }

      /* 수정 지시 — 항목 하나 또는 전체를 골라 다시 생성합니다.
         항목 하나를 고르면 그 항목의 글과 보드의 해당 칸만 바뀌고 나머지는 그대로 남습니다. */
      function editSelection(stage) {
        const items = stageItems(stage);
        const v = state.editSel ? state.editSel[stage] : undefined;
        if (v === "all" || !items.length) return "all";
        const n = Math.round(Number(v));
        return n >= 1 && n <= items.length ? n : 1;
      }

      function instructionBox(stage, placeholder) {
        const id = `ins-${stage}`;
        const items = stageItems(stage);
        const sel = editSelection(stage);
        const target = sel === "all" ? null : items[sel - 1];
        const chipCls = on => on
          ? "bg-blue-50 border-blue-700 text-blue-800"
          : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50";
        const chips = items.map(it => `<button type="button" aria-pressed="${sel === it.index}" aria-label="${escAttr(pad2(it.index))}번 항목 선택"
            onclick="Actions.pickEditTarget('${stage}', ${it.index})"
            class="h-14 rounded-2xl border font-bold t-small tabular-nums transition-all active:scale-95 ${chipCls(sel === it.index)}">${esc(pad2(it.index))}</button>`).join("")
          + `<button type="button" aria-pressed="${sel === "all"}" onclick="Actions.pickEditTarget('${stage}', 'all')"
            class="h-14 rounded-2xl border font-bold t-small transition-all active:scale-95 ${chipCls(sel === "all")}">전체</button>`;
        const downstream = stage !== "emotion" ? " 이후 단계 결과는 초기화됩니다." : "";
        const desc = target
          ? `${pad2(target.index)} · ${itemCaption(stage, target).ko}`
          : `전체 ${items.length}개 항목과 이미지를 모두 다시 생성합니다.${downstream}`;
        const btnLabel = target ? `${pad2(target.index)}번 항목만 수정` : "전체 다시 생성";
        return `<section class="p-5 bg-slate-50 border-2 border-slate-200 rounded-[2rem] shadow-sm mt-8">
          <h3 class="t-h3 text-slate-600 mb-4">수정 지시</h3>
          <h4 class="t-small font-bold text-slate-600 mb-2.5">수정할 항목</h4>
          <div class="grid grid-cols-6 gap-2 mb-3" role="group" aria-label="수정할 항목 선택">${chips}</div>
          <p class="t-small text-slate-700 mb-3 prose-ko">${esc(desc)}</p>
          <label for="${id}" class="sr-only">수정 지시 입력</label>
          <textarea id="${id}" rows="3" oninput="setDraft('${id}', this.value)"
            class="w-full block min-w-0 bg-white border border-slate-300 rounded-2xl px-4 py-3.5 text-slate-800 t-small outline-none resize-none placeholder:text-slate-400 focus:border-blue-700 mb-3"
            placeholder="${escAttr(placeholder)}">${esc(draft(id))}</textarea>
          <button type="button" onclick="Actions.editItem('${stage}')"
            class="w-full py-4 rounded-2xl bg-white border-2 border-slate-300 text-slate-800 font-bold t-small flex items-center justify-center gap-2 hover:bg-slate-100 active:scale-[0.98] transition-all">
            <i data-lucide="send" class="w-5 h-5"></i>${esc(btnLabel)}
          </button>
        </section>`;
      }

      /* 다음 단계 결과가 이미 있으면 다시 생성하지 않고 그 단계로 이동합니다.
         다시 만들고 싶을 때는 각 단계의 'AI 수정 지시'를 씁니다. */
      /* 하단 버튼은 항상 다음 단계를 새로 분석합니다. 지난 결과는 상단 좌우 꺽쇠로 오갑니다. */
      function nextDock(nextStep, label) {
        return dock(primaryBtn(label, `Actions.runNext(${nextStep})`));
      }

      /* 카드 번호와 같은 번호로 적어야 화면에서 근거를 바로 찾을 수 있습니다. */
      function joinTitles(items, key) {
        return items.map(it => `${pad2(it.index)} ${it[key]}`).join("   ");
      }
      function sourceTitles(ids, list, key) {
        return list.filter(x => (ids || []).includes(x.id)).map(x => `${pad2(x.index)} ${x[key]}`).join(", ");
      }
      function sourceLine(label, ids, list, key) {
        const t = sourceTitles(ids, list, key);
        return t ? `<p class="t-meta text-teal-800 prose-ko">${esc(label)} · ${esc(t)}</p>` : "";
      }

      function sectionTitle(text, sub) {
        return `<h2 class="t-h1 text-slate-900 mb-2">${esc(text)}</h2>
          ${sub ? `<p class="t-small text-slate-600 mb-6 prose-ko">${esc(sub)}</p>` : `<div class="mb-6"></div>`}`;
      }

      /* =========================================================
         13. 텍스트 리포트
         ========================================================= */
      function buildReport() {
        const L = [];
        const line = "==================================================";
        const o = state.object;
        const e = state.emotion;
        L.push(line, "   사물 · 물성 · 지각 · 감성 분석 리포트", line, "");
        L.push("[분석 사물]", `- ${objectName() || "입력된 사물 없음"}${o && o.nameEn ? ` / ${o.nameEn}` : ""}`);
        L.push(`- 입력 방식: ${state.images.source ? "사진" : "키워드"}${state.keyword ? ` (${state.keyword})` : ""}`);
        L.push("- 분석 기준: 대부분의 사람이 일상에서 이 사물을 마주하는 보편적 상황", "");
        if (o) {
          L.push(line, " 1. 사물 개요", line, "");
          L.push(`${o.nameKo} · ${o.kind}`, `  ${o.summary}`);
          if (o.specimen) L.push(`  기준 표본: ${o.specimen}`);
          if (o.palette.length) L.push(`  관찰 색: ${o.palette.map(p => `${p.name || p.role} ${p.hex}`).join(", ")}`);
          state.traits.forEach(t => {
            L.push("", `${pad2(t.index)}. [${t.category}] ${t.titleKo} / ${t.titleEn} · ${t.certainty}`);
            L.push(`  ${t.observation}`);
          });
          L.push("");
        }
        if (state.properties.length) {
          L.push(line, " 2. 물성 분석", line);
          state.properties.forEach(p => {
            L.push("", `${pad2(p.index)}. [${p.axis}] ${p.titleKo} / ${p.titleEn} · 추정 ${p.level} (LOW 0 - HIGH 100 축에서 ${p.value})`);
            L.push(`  ${p.description}`);
            if (p.measure) L.push(`  측정·확인: ${p.measure}`);
          });
          L.push("");
        }
        if (state.perceptions.length) {
          L.push(line, " 3. 지각 분석 — 핵심 지각 경험", line);
          state.perceptions.forEach(p => {
            L.push("", `${pad2(p.index)}. ${p.moment} · ${p.titleKo} / ${p.titleEn}`);
            if (p.situation) L.push(`  상황: ${p.situation}`);
            L.push(`  ${p.description}`);
            if (p.cue) L.push(`  관찰 단서: ${p.cue}`);
          });
          L.push("");
        }
        if (e) {
          L.push(line, " 4. 감성 분석", line, "");
          L.push(`경험 감성 방향: ${e.nameKo} / ${e.nameEn}`);
          if (e.moodWords.length) L.push(`감성 단어: ${e.moodWords.join(" · ")}`);
          L.push(e.definition);
          if (e.trace) L.push(`지각에서 온 근거: ${e.trace}`);
          e.layers.forEach(l => {
            L.push("", `${pad2(l.index)}. [${l.phase}] ${l.nameKo} / ${l.nameEn} · 강도 ${l.intensity}/100`);
            L.push(`  ${l.description}`);
          });
          L.push("");
        }
        L.push(line, `생성 시각: ${nowLabel(Date.now())}`, line);
        return L.join("\n");
      }


      /* =========================================================
         13-B. PDF 리포트 — 블록 단위로 캡처해 A4에 배치합니다.
         ========================================================= */
      const PDF = {
        W: 794,
        ACCENT: "#0f766e",
        blk(inner, pad) {
          return `<div style="box-sizing:border-box;width:794px;padding:${pad || "0 0 14px 0"};background:#ffffff;font-family:'Pretendard',sans-serif;color:#0f172a;">${inner}</div>`;
        },
        heading(no, title, en) {
          return PDF.blk(`<div style="border-top:3px solid #0f172a;padding-top:12px;margin-top:18px;">
            <span style="font-size:22px;font-weight:800;">${esc(no)}</span>
            <span style="font-size:22px;font-weight:800;margin-left:8px;">${esc(title)}</span>
            <span style="font-size:16px;color:#64748b;margin-left:10px;">${esc(en)}</span>
          </div>`);
        },
        image(slot, caption, width) {
          const url = state.images && state.images[slot];
          if (!url) return "";
          return PDF.blk(`<img src="${escAttr(url)}" style="width:${width || 520}px;display:block;margin:0 auto 8px;border:1px solid #e2e8f0;" />
            <p style="font-size:14px;color:#64748b;text-align:center;margin:0;">${esc(caption)}</p>`);
        },
        /* 항목별 이미지가 있으면 카드 안에 함께 넣습니다. ratio > 1 이면 가로형(감성)이라 위에 크게 둡니다. */
        card(inner, img, ratio) {
          if (img && ratio > 1) {
            inner = `<img src="${escAttr(img)}" style="width:100%;display:block;border-radius:10px;margin-bottom:12px;" />${inner}`;
          } else if (img) {
            inner = `<div style="display:flex;gap:18px;align-items:flex-start;">
              <img src="${escAttr(img)}" style="width:170px;height:170px;flex-shrink:0;border-radius:10px;border:1px solid #e2e8f0;" />
              <div style="flex:1;min-width:0;">${inner}</div></div>`;
          }
          return PDF.blk(`<div style="border:1px solid #cbd5e1;border-radius:14px;padding:16px 18px;">${inner}</div>`, "0 0 10px 0");
        },
        kv(k, v) {
          if (!v) return "";
          return `<div style="margin-top:8px;">
            <div style="font-size:14px;font-weight:700;color:#64748b;">${esc(k)}</div>
            <div style="font-size:16px;line-height:1.7;white-space:pre-line;">${esc(v)}</div>
          </div>`;
        },
        meta(k, v) {
          return v ? `<div style="font-size:14px;color:#64748b;margin-top:6px;">${esc(k)} · ${esc(v)}</div>` : "";
        },
        bar(value) {
          const pct = Math.max(2, Math.min(98, Number(value) || 55));
          return `<div style="position:relative;height:20px;margin:10px 0 4px;">
            <div style="position:absolute;left:34px;right:40px;top:9px;height:3px;background:#e2e8f0;border-radius:2px;"></div>
            <div style="position:absolute;left:0;top:2px;font-size:13px;color:#94a3b8;">LOW</div>
            <div style="position:absolute;right:0;top:2px;font-size:13px;color:#94a3b8;">HIGH</div>
            <div style="position:absolute;top:4px;left:calc(34px + (100% - 74px) * ${pct} / 100);width:13px;height:13px;margin-left:-6px;border-radius:50%;background:${PDF.ACCENT};"></div>
          </div>`;
        },
        palette(list) {
          if (!list || !list.length) return "";
          return `<div style="margin-top:12px;">${list.map(p => `<div style="display:inline-block;vertical-align:top;width:132px;margin:0 10px 8px 0;">
            <div style="height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:${escAttr(p.hex)};"></div>
            <div style="font-size:14px;font-weight:700;margin-top:4px;">${esc(p.name || p.role)}</div>
            <div style="font-size:13px;color:#64748b;">${esc(p.role)} ${esc(p.hex)}</div>
          </div>`).join("")}</div>`;
        },
        document() {
          const o = state.object;
          const out = [];

          out.push(PDF.blk(`<div style="padding-bottom:6px;">
            <div style="font-size:14px;letter-spacing:0.12em;color:#64748b;font-weight:700;">OBJECT EXPERIENCE LAB</div>
            <h1 style="font-size:30px;font-weight:800;margin:6px 0 10px;letter-spacing:-0.02em;">사물 · 물성 · 지각 · 감성 리포트</h1>

          if (state.perceptions.length) {
            out.push(PDF.heading("03", "지각 분석", "Perception in Experience"));

              out.push(PDF.card(`

                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(p.moment)}</span></div>
                <div style="font-size:15px;color:#64748b;">${esc(p.titleEn)}</div>

                <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(p.description)}</div>
                ${PDF.meta("관찰 단서", p.cue)}
                ${PDF.meta("근거 물성", sourceTitles(p.fromIds, state.properties, "titleKo"))}`, itemImg("perception", p.id), 1));

          if (state.emotion) {

              ${PDF.kv("지각에서 온 근거", e.trace)}`));

            e.layers.forEach(l => {
              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(l.index)}  ${esc(l.nameKo)}
