      /* =========================================================
         8. OpenAI 호출 — 모델 고정: 분석 GPT-5.6 Terra / 이미지 Image 2.5 Flare
         텍스트 분석은 Responses API — 사진이 있으면 input_image로 함께 보냅니다.
         파라미터를 지원하지 않는 모델을 만나면 옵션을 하나씩 덜어내며 재시도합니다.
         ========================================================= */
      let activeController = null;

      function parseModelJson(text) {
        let t = String(text || "").trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 구간 추출 재시도 */ }
        const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
        const first = starts.length ? Math.min.apply(null, starts) : -1;
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (first >= 0 && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      function extractOutputText(data) {
        if (data && typeof data.output_text === "string" && data.output_text.trim()) return data.output_text;
        const out = (data && Array.isArray(data.output)) ? data.output : [];
        const parts = [];
        out.forEach(item => {
          if (item && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if (c && typeof c.text === "string" && (c.type === "output_text" || c.type === "text")) parts.push(c.text);
            });
          }
        });
        return parts.join("\n");
      }

      function httpMessage(status, payload) {
        const detail = payload && payload.error && payload.error.message ? payload.error.message : "";
        if (status === 401 || status === 403) return "API 키가 유효하지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.";
        if (status === 404) return `이 API 키로는 ${CONFIG.TEXT_MODEL_LABEL} 또는 ${CONFIG.IMAGE_MODEL_LABEL}를 쓸 수 없습니다. OpenAI 계정의 모델 접근 권한을 확인해 주세요.${detail ? " (" + detail + ")" : ""}`;
        if (status === 429) return "요청이 너무 많거나 사용 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.";
        if (status === 400) return detail || "요청 형식이 거부되었습니다.";
        return `요청이 거부되었습니다 (상태 ${status}).${detail ? " " + detail : ""}`;
      }

      async function postApi(path, body, controller) {
        const isForm = typeof FormData !== "undefined" && body instanceof FormData;
        const headers = { "Authorization": `Bearer ${state.apiKey || ""}` };
        if (!isForm) headers["Content-Type"] = "application/json";
        const res = await fetch(CONFIG.API_BASE + path, {
          method: "POST",
          signal: controller.signal,
          headers,
          body: isForm ? body : JSON.stringify(body)
        });
        let payload = null;
        try { payload = await res.json(); } catch (e) { payload = null; }
        if (!res.ok) {
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403].includes(res.status);
          err.paramIssue = res.status === 400 || res.status === 404;
          throw err;
        }
        return payload;
      }

      async function callText(systemPrompt, userPrompt, photoDataUrl) {
        const controller = new AbortController();
        activeController = controller;

        const userContent = photoDataUrl
          ? [{ type: "input_text", text: userPrompt }, { type: "input_image", image_url: photoDataUrl, detail: "high" }]
          : userPrompt;
        const input = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userContent }
        ];
        const variants = [
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 16000, reasoning: { effort: "low" } },
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 16000 },
          { model: CONFIG.TEXT_MODEL, input, text: { format: { type: "json_object" } } },
          { model: CONFIG.TEXT_MODEL, input }
        ];

        const delays = [900, 2200, 5000];
        let lastError = "알 수 없는 오류가 발생했습니다.";
        let lastStatus = 0;
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postApi("/responses", variants[vi], controller);
            if (data && data.status === "incomplete") {
              const e = new Error("응답이 최대 길이에 도달해 잘렸습니다. 수정 지시를 더 간단히 적어 다시 시도해 주세요.");
              e.noRetry = true;
              throw e;
            }
            const text = extractOutputText(data);
            if (!text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
            return parseModelJson(text);
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            lastStatus = err.status || 0;
            if (err.fatal || err.noRetry) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        if (photoDataUrl && lastStatus === 400 && /image/i.test(lastError)) {
          throw new Error(`${CONFIG.TEXT_MODEL_LABEL}가 이 사진 입력을 받지 않았습니다. 사진을 빼고 사물 키워드로 분석해 주세요.`);
        }
        throw new Error(lastError);
      }

      function imageFromResponse(data) {
        const first = data && Array.isArray(data.data) ? data.data[0] : null;
        if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
        if (first && first.url) return first.url;
        throw new Error("이미지 응답이 비어 있습니다. 다시 시도해 주세요.");
      }

      async function runImageVariants(build, delays, fallbackMsg) {
        let lastError = fallbackMsg;
        let vi = 0;
        let attempt = 0;
        const total = build.count;
        while (vi < total) {
          try {
            return imageFromResponse(await build.send(vi));
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) { const e = new Error(lastError); e.fatal = true; throw e; }
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      async function callImage(prompt) {
        const controller = new AbortController();
        activeController = controller;
        const variants = [
          { model: CONFIG.IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE, quality: state.quality },
          { model: CONFIG.IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE },
          { model: CONFIG.IMAGE_MODEL, prompt }
        ];
        return runImageVariants({
          count: variants.length,
          send: vi => postApi("/images/generations", variants[vi], controller)
        }, [1200, 3000], "이미지를 생성하지 못했습니다.");
      }

      /* 기존 통합 이미지를 입력으로 넣어 지정한 칸만 바꿉니다. */
      async function callImageEdit(prompt, sourceUrl) {
        const controller = new AbortController();
        activeController = controller;
        let blob;
        try {
          const r = await fetch(sourceUrl);
          blob = await r.blob();
        } catch (e) {
          throw new Error("편집할 통합 이미지를 읽지 못했습니다.");
        }
        const type = blob.type || "image/png";
        const ext = /jpe?g/i.test(type) ? "jpg" : (/webp/i.test(type) ? "webp" : "png");
        const variants = [
          { size: CONFIG.IMAGE_SIZE, quality: state.quality, input_fidelity: "high" },
          { size: CONFIG.IMAGE_SIZE, quality: state.quality },
          { size: CONFIG.IMAGE_SIZE },
          {}
        ];
        return runImageVariants({
          count: variants.length,
          send: vi => {
            const form = new FormData();
            form.append("model", CONFIG.IMAGE_MODEL);
            form.append("prompt", prompt);
            form.append("image", new Blob([blob], { type }), `board.${ext}`);
            Object.keys(variants[vi]).forEach(k => form.append(k, String(variants[vi][k])));
            return postApi("/images/edits", form, controller);
          }
        }, [1200, 3000], "이미지를 편집하지 못했습니다.");
      }

      async function withLoading(msg, fn) {
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("작업을 취소했습니다."); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: (err && err.message) || "처리에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      /* =========================================================
         8-B. 사진·이미지 준비
         - 올린 사진은 긴 변 1280px JPEG로 줄여 전송량과 저장 용량을 낮춥니다.
         - 생성된 PNG 통합 이미지는 저장 전에 JPEG로 바꿔 용량을 약 1/4로 줄입니다.
         투명 PNG는 흰 바탕에 올려 검게 변하지 않게 합니다.
         ========================================================= */
      function preparePhoto(file) {
        return new Promise((resolve, reject) => {
          if (!file) { reject(new Error("사진을 찾지 못했습니다.")); return; }
          if (file.type && !/^image\//.test(file.type)) { reject(new Error("사진 파일만 올릴 수 있습니다.")); return; }
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            try {
              const w0 = img.naturalWidth, h0 = img.naturalHeight;
              if (!w0 || !h0) throw new Error("사진 크기를 읽지 못했습니다. 다른 사진으로 시도해 주세요.");
              const scale = Math.min(1, CONFIG.PHOTO_MAX_EDGE / Math.max(w0, h0));
              const w = Math.max(1, Math.round(w0 * scale));
              const h = Math.max(1, Math.round(h0 * scale));
              const cv = document.createElement("canvas");
              cv.width = w; cv.height = h;
              const ctx = cv.getContext("2d");
              if (!ctx) throw new Error("이 브라우저에서는 사진을 처리할 수 없습니다.");
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              resolve(cv.toDataURL("image/jpeg", CONFIG.PHOTO_QUALITY));
            } catch (e) {
              reject(e instanceof Error ? e : new Error("사진을 처리하지 못했습니다."));
            } finally {
              URL.revokeObjectURL(url);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("이 사진 형식은 열 수 없습니다. JPG나 PNG로 바꿔 다시 올려 주세요."));
          };
          img.src = url;
        });
      }

      function blobToDataUrl(blob) {
        return new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.onerror = () => rej(fr.error);
          fr.readAsDataURL(blob);
        });
      }

      async function toStorableImage(url) {
        let src = url;
        /* 주소로 받은 이미지는 시간이 지나면 만료되므로 가능하면 데이터로 바꿔 둡니다. */
        if (!/^data:/i.test(src)) {
          try { src = await blobToDataUrl(await (await fetch(src)).blob()); } catch (e) { return url; }
        }
        if (/^data:image\/jpe?g/i.test(src)) return src;
        return new Promise(resolve => {
          /* 이미지 디코딩이 멈추는 드문 경우에도 저장이 막히지 않도록 원본으로 넘어갑니다. */
          const guard = setTimeout(() => resolve(src), 8000);
          const done = v => { clearTimeout(guard); resolve(v); };
          const img = new Image();
          img.onload = () => {
            const resolve = done;
            try {
              const cv = document.createElement("canvas");
              cv.width = img.naturalWidth; cv.height = img.naturalHeight;
              const ctx = cv.getContext("2d");
              if (!ctx || !cv.width) { resolve(src); return; }
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, cv.width, cv.height);
              ctx.drawImage(img, 0, 0);
              resolve(cv.toDataURL("image/jpeg", CONFIG.IMAGE_STORE_QUALITY));
            } catch (e) { resolve(src); }
          };
          img.onerror = () => done(src);
          img.src = src;
        });
      }

      /* =========================================================
         9. 응답 정규화 — 필드가 빠져도 화면이 죽지 않도록 방어
         ========================================================= */
      const str = v => (typeof v === "string" ? v.trim() : (v === null || v === undefined ? "" : String(v)));
      const arr = v => (Array.isArray(v) ? v : []);

      function matchStyle(raw, i) {
        const want = str(raw).toLowerCase();
        if (want) {
          const exact = STYLE_NAMES.find(n => n.toLowerCase() === want);
          if (exact) return exact;
          const partial = STYLE_NAMES.find(n => n.toLowerCase().includes(want) || want.includes(n.toLowerCase()));
          if (partial) return partial;
        }
        return STYLE_NAMES[i % STYLE_NAMES.length];
      }

      function normHex(v) {
        let s = str(v);
        if (!s) return "";
        if (s[0] !== "#") s = "#" + s;
        if (/^#[0-9a-f]{6}$/i.test(s)) return s.toUpperCase();
        if (/^#[0-9a-f]{3}$/i.test(s)) return ("#" + s.slice(1).split("").map(c => c + c).join("")).toUpperCase();
        return "";
      }

      /* AI가 돌려준 근거 번호(앞 단계 목록 번호, 1부터)를 실제 항목 id로 바꿉니다. */
      function mapFrom(list, source) {
        const ids = arr(list).map(n => {
          const k = Math.round(Number(n));
          return (k >= 1 && k <= source.length) ? source[k - 1].id : null;
        }).filter(Boolean);
        return Array.from(new Set(ids));
      }

      function clampValue(raw, level) {
        const n = Number(raw);
        if (raw !== "" && raw !== null && raw !== undefined && Number.isFinite(n)) return Math.max(2, Math.min(98, Math.round(n)));
        const map = { "낮음": 22, "중간": 55, "높음": 84 };
        return map[str(level)] || 55;
      }
      function levelFromValue(v) { return v < 38 ? "낮음" : (v > 68 ? "높음" : "중간"); }

      function normObject(raw, keyword) {
        const o = raw && raw.object && typeof raw.object === "object" ? raw.object : {};
        const kind = str(o.kind);
        const nameKo = str(o.nameKo) || keyword || "사진 속 사물";
        return {
          nameKo,
          nameEn: str(o.nameEn),
          kind: OBJECT_KINDS.includes(kind) ? kind : (kind || "사물"),
          summary: str(o.summary) || NO_DATA,
          specimen: str(o.specimen),
          palette: arr(o.palette).map(p => ({
            hex: normHex(p && p.hex), name: str(p && p.name), role: str(p && p.role)
          })).filter(p => p.hex).slice(0, 5),
          visual: str(o.visual) || `a clear studio photograph of a single ${str(o.nameEn) || "object"} on a neutral background in soft diffused light`
        };
      }

      /* 사물 특징은 AI가 정한 중요도 순서를 유지합니다. category가 없으면 구버전 cmf 값을 받아 호환합니다. */
      function normTraits(raw) {
        return arr(raw && raw.traits).slice(0, 14).map((t, i) => {
          const categoryRaw = str(t && (t.category || t.cmf));
          const category = categoryRaw || FEATURE_CATEGORIES[i % FEATURE_CATEGORIES.length];
          return {
            id: uid("trt"),
            index: i + 1,
            category,
            cmf: category,
            titleKo: str(t && t.titleKo) || `사물 특징 ${i + 1}`,
            titleEn: str(t && t.titleEn) || `Object Feature ${i + 1}`,
            observation: str(t && t.observation) || NO_DATA,
            evidence: str(t && t.evidence),
            certainty: str(t && t.certainty) === "추정" ? "추정" : "관찰",
            visual: str(t && t.visual) || "an editorial object-analysis image that clearly shows this structural, formal, material or functional characteristic",
            label: str(t && t.label) || str(t && t.titleEn) || `Feature ${i + 1}`,
            labelKo: str(t && t.labelKo) || str(t && t.titleKo) || `특징 ${i + 1}`
          };
        });
      }

      function normProperties(raw, traits) {
        const levels = ["낮음", "중간", "높음"];
        return arr(raw && raw.properties).filter(p => p && typeof p === "object").slice(0, 14).map((p, i) => {
          const value = clampValue(p.value, p.level);
          return {
            id: uid("prp"),
            index: i + 1,
            axis: str(p.axis) || "물성",
            titleKo: str(p.titleKo) || `물성 ${i + 1}`,
            titleEn: str(p.titleEn) || `Property ${i + 1}`,
            description: str(p.description) || NO_DATA,
            fromIds: mapFrom(p.from, traits),
            measure: str(p.measure),
            value,
            level: levels.includes(str(p.level)) ? str(p.level) : levelFromValue(value),
            visual: str(p.visual) || "a professional editorial close-up that expresses this property through surface, light, depth or texture"
          };
        });
      }

      /* 지각 개수와 맥락은 AI가 사물에 맞게 결정합니다. */
      function normPerceptions(raw, props) {
        return arr(raw && raw.perceptions).filter(p => p && typeof p === "object").slice(0, 14).map((p, i) => ({
          id: uid("prc"),
          index: i + 1,
          moment: str(p.moment || p.category) || "지각",
          situation: str(p.situation),
          titleKo: str(p.titleKo) || `지각 ${i + 1}`,
          titleEn: str(p.titleEn) || `Perception ${i + 1}`,
          description: str(p.description) || NO_DATA,
          fromIds: mapFrom(p.from, props),
          cue: str(p.cue),
          visual: str(p.visual) || "a single everyday scene that clearly demonstrates this perception",
          label: str(p.label) || str(p.titleEn) || `Perception ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo) || `지각 ${i + 1}`,
          style: matchStyle(p.style, i)
        }));
      }

      function normLayers(rawItems, percs) {
        return rawItems.filter(l => l && typeof l === "object")
          .sort((a, b) => (Number(b.intensity) || 0) - (Number(a.intensity) || 0))
          .slice(0, 2).map((l, i) => ({
            id: uid("emo"),
            index: i + 1,
            phase: str(l.category || l.phase) || "감성",
            nameKo: str(l.nameKo) || `감성 ${i + 1}`,
            nameEn: str(l.nameEn) || `Emotion ${i + 1}`,
            description: str(l.description) || NO_DATA,
            fromIds: mapFrom(l.from, percs),
            intensity: Math.max(0, Math.min(100, Math.round(Number(l.intensity) || 60))),
            visual: str(l.visual) || "a refined single-scene visual metaphor for this emotional quality",
            label: str(l.label) || str(l.nameEn) || `Emotion ${i + 1}`,
            labelKo: str(l.labelKo) || str(l.nameKo) || `감성 ${i + 1}`,
            style: matchStyle(l.style, i)
          }));
      }

      function normEmotion(raw, percs) {
        const e = raw && raw.emotion && typeof raw.emotion === "object" ? raw.emotion : null;
        if (!e) return null;
        const rawItems = arr(e.emotions).length ? arr(e.emotions) : arr(e.layers);
        const layers = normLayers(rawItems.slice(), percs);
        if (!layers.length) return null;
        return {
          nameKo: str(e.nameKo) || "종합 감성",
          nameEn: str(e.nameEn) || "Overall Emotion",
          definition: str(e.summary || e.definition) || NO_DATA,
          moodWords: arr(e.moodWords).map(w => str(w)).filter(Boolean).slice(0, 10),
          trace: str(e.trace),
          layers
        };
      }

      /* 부분 수정 응답에서 항목 하나를 꺼냅니다. 모델이 형식을 조금 어겨도 받아 냅니다. */
      function pickItem(data, plural, singular) {
        if (!data || typeof data !== "object") return null;
        if (data.item && typeof data.item === "object") return Array.isArray(data.item) ? data.item[0] : data.item;
        const s = data[singular];
        if (s && typeof s === "object" && !Array.isArray(s)) {
          if (Array.isArray(s.emotions) && s.emotions.length) return s.emotions[0];
          return s;
        }
        if (Array.isArray(data[plural]) && data[plural].length) return data[plural][0];
        if (data.titleKo || data.nameKo) return data;
        return null;
      }

      /* =========================================================
         10. 단계 이동 규칙 — 데이터가 준비된 단계까지만 이동
         ========================================================= */
      function stepReady(n) {
        switch (n) {
          case 1: return true;
          case 2: return state.properties.length > 0;
          case 3: return state.perceptions.length > 0;
          case 4: return !!state.emotion;
          default: return false;
        }
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      /* 홈으로 나가며 저장할 때 step이 0이 되어 1로 기록되지 않도록
         마지막으로 작업하던 단계를 따로 기억해 둡니다. */
      let lastWorkStep = 1;
      let opening = false;

      function snapshot() {
        return {
          projectId: state.projectId,
          keyword: state.keyword,
          note: state.note,
          hasPhoto: !!state.images.source,
          object: state.object,
          traits: state.traits,
          properties: state.properties,
          perceptions: state.perceptions,
          emotion: state.emotion,
          synthesis: state.synthesis,
          createdAt: state.createdAt,
          step: Math.min(4, Math.max(1, state.step >= 1 ? state.step : lastWorkStep))
        };
      }

      function hasContent() {
        return !!(state.keyword || state.object || state.images.source || state.traits.length);
      }

      function objectName() {
        if (state.object && state.object.nameKo) return state.object.nameKo;
        if (state.keyword) return state.keyword;
        return state.images.source ? "사진 속 사물" : "";
      }

      function projectTitle() {
        const name = objectName();
        const emo = state.emotion && state.emotion.layers && state.emotion.layers[0] ? state.emotion.layers[0].nameKo : "";
        if (name && emo) return `${name} · ${emo}`;
        return name || "이름 없는 프로젝트";
      }

      function persist(showToast) {
        if (!hasContent()) {
          if (showToast) toast("아직 저장할 내용이 없습니다.");
          return Promise.resolve("empty");
        }
        if (!Store.ready) {
          if (showToast) toast("저장소를 준비하고 있습니다. 잠시 후 다시 눌러 주세요.");
          return Promise.resolve("pending");
        }
        /* 상태는 호출 순간에 복사해 두어야 이후 화면 변경과 섞이지 않습니다. */
        const snap = snapshot();
        const meta = { id: state.projectId, title: projectTitle() };
        return Store.save(snap, meta).then(r => {
          if (r.ok) {
            if (showToast) toast("진행 상태를 저장했습니다.");
            else if (r.recovered) toast("밀려 있던 변경 내용을 저장했습니다.");
            if (r.freed && r.freed.length) toast(`저장 공간을 확보하려고 오래된 프로젝트 ${r.freed.length}개를 정리했습니다.`);
            return "ok";
          }
          /* 새로운 변경이 저장되지 못할 때마다 알립니다. 같은 내용의 자동 재시도는 조용히 처리합니다. */
          if (!r.repeat || showToast) {
            toast(r.full
              ? "브라우저 저장 공간이 가득 차 이 프로젝트를 저장하지 못했습니다. PDF로 내려받아 보관해 주세요."
              : "진행 상태를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
          }
          return "full";
        }).catch(e => { console.warn("자동 저장 실패", e); return "error"; });
      }

      /* 다시 생성하면 뒤 단계 이미지는 화면과 저장소 양쪽에서 함께 지웁니다.
         화면에서만 지우면 프로젝트를 다시 열 때 옛 이미지가 되살아납니다. */
      function clearImages(slots) {
        const patch = {};
        slots.forEach(s => { patch[s] = null; ImageDB.remove(state.projectId, s); });
        state.images = Object.assign({}, state.images, patch);
      }

      /* =========================================================
         12. 렌더 헬퍼
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const nextN = state.step + 1;
        const showNext = STAGES.some(s => s.n === nextN) && stepReady(nextN);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-700">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${nextN}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="Actions.copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="Actions.goHome()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-2 bg-slate-300 rounded-full flex-1 overflow-hidden"><div class="h-full bg-teal-700 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-600 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-5 dock bg-white max-w-[430px] mx-auto z-[60]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none shadow-lg active:scale-[0.98] disabled:active:scale-100 transition-all">${esc(label)}</button>`;
      }

      function secondaryBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="w-full py-4 rounded-2xl font-bold t-small text-slate-700 bg-white border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">${icon ? `<i data-lucide="${icon}" class="w-5 h-5"></i>` : ""}${esc(label)}</button>`;
      }

      function ghostBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="px-4 py-2.5 rounded-xl font-bold t-meta text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 transition-all inline-flex items-center gap-1.5 flex-shrink-0">${icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : ""}${esc(label)}</button>`;
      }

      /* 분석 결과 카드 — 수정 대상으로 고른 카드는 파란 테두리로 표시합니다. */
      function infoCard(opts) {
        const badge = opts.badge
          ? `<span class="t-meta font-bold px-2.5 py-1 rounded-lg flex-shrink-0 bg-slate-200 text-slate-700">${esc(opts.badge)}</span>`
          : "";
        const border = opts.active ? "border-blue-700 ring-4 ring-blue-100" : "border-slate-200";
        return `<article class="w-full p-5 rounded-[2rem] border-2 ${border} bg-white shadow-md transition-all">
          <div class="flex items-start gap-3 mb-3">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums bg-slate-900 text-white">${esc(pad2(opts.index))}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(opts.title)}</h3>
              ${opts.subtitle ? `<p class="t-meta text-slate-500">${esc(opts.subtitle)}</p>` : ""}
            </div>
            ${badge}
          </div>
          <div class="space-y-2">${opts.body || ""}</div>
        </article>`;
      }

      function chip(text, tone) {
        const cls = tone === "accent"
          ? "bg-teal-50 text-teal-800 border-teal-200"
          : "bg-slate-100 text-slate-700 border-slate-200";
        return `<span class="inline-block t-meta px-2.5 py-1 rounded-lg border ${cls}">${esc(text)}</span>`;
      }

      function imageCard(slot, opts) {
        const url = state.images ? state.images[slot] : null;
        const inner = url
          ? `<button type="button" onclick="Actions.openLightbox('${slot}')" class="block w-full" aria-label="${escAttr(opts.title)} 크게 보기">
               <img src="${escAttr(url)}" alt="${escAttr(opts.alt || "생성된 통합 이미지")}" class="w-full rounded-2xl bg-slate-100" />
             </button>`
          : `<div class="w-full rounded-2xl bg-slate-100 border-2 border-dashed border-slate-300 px-5 py-10 text-center">
               <i data-lucide="image" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
               <p class="t-small text-slate-600 mb-4">${esc(opts.empty || "아직 이미지를 만들지 않았습니다.")}</p>
               ${opts.onGenerate ? ghostBtn("이미지 만들기", opts.onGenerate, "image-plus") : ""}
             </div>`;
        return `<section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <h3 class="t-label text-slate-500">${esc(opts.title)}</h3>
            ${url ? ghostBtn("이미지 저장", `Actions.downloadImage('${slot}')`, "download") : ""}
          </div>
          ${inner}
        </section>`;
      }

      /* ---- 수정 지시 — 항목 하나 또는 전체를 골라 다시 생성합니다 ---- */
      function currentTarget(key, items) {
        const raw = drafts[`sel-${key}`];
        if (raw === undefined || raw === "all") return "all";
        const n = Number(raw);
        return items.some(it => it.index === n) ? n : "all";
      }

      function instructionBox(key, items, opts) {
        const id = `ins-${key}`;
        const sel = currentTarget(key, items);
        const selItem = sel === "all" ? null : items.find(it => it.index === sel);
        const btn = (val, text, aria) => {
          const on = String(val) === String(sel);
          return `<button type="button" aria-pressed="${on}" aria-label="${escAttr(aria)}" onclick="Actions.pickEditTarget('${key}','${val}')"
            class="h-14 rounded-2xl border font-bold t-small tabular-nums transition-all active:scale-95 ${on ? "bg-blue-50 border-blue-800 text-blue-900" : "bg-white border-slate-300 text-slate-700 hover:bg-slate-50"}">${esc(text)}</button>`;
        };
        const target = selItem
          ? `${pad2(selItem.index)} · ${selItem[opts.titleKey]}`
          : "전체 · 이 단계의 모든 항목을 다시 분석합니다";
        return `<section class="mt-8 p-5 bg-slate-50 rounded-[2rem] border-2 border-slate-200 shadow-sm">
          <h3 class="t-h3 text-slate-600 mb-4">수정 지시</h3>
          <h4 class="t-small font-bold text-slate-700 mb-2">수정할 항목</h4>
          <div class="grid grid-cols-6 gap-2 mb-4" role="group" aria-label="수정할 항목 선택">
            ${items.map(it => btn(it.index, pad2(it.index), `${pad2(it.index)}번 ${it[opts.titleKey]}`)).join("")}
            ${btn("all", "전체", "전체 항목")}
          </div>
          <p class="t-small text-slate-800 mb-2 prose-ko">${esc(target)}</p>
          ${!selItem && opts.downstreamNote ? `<p class="t-meta text-slate-500 mb-2 prose-ko">${esc(opts.downstreamNote)}</p>` : ""}
          ${selItem ? `<p class="t-meta text-slate-500 mb-2 prose-ko">선택한 항목과 통합 이미지의 해당 칸만 바뀌고, 다른 항목은 그대로 유지됩니다.</p>` : ""}
          <label for="${id}" class="sr-only">수정 지시 입력</label>
          <textarea id="${id}" rows="4" oninput="setDraft('${id}', this.value)"
            class="w-full block min-w-0 mt-2 bg-white border border-slate-300 rounded-2xl px-4 py-3.5 text-slate-900 t-small outline-none resize-none placeholder:text-slate-400 focus:border-blue-700 mb-4"
            placeholder="${escAttr(opts.placeholder)}">${esc(draft(id))}</textarea>
          <button type="button" onclick="Actions.applyEdit('${key}')"
            class="w-full py-4 rounded-2xl bg-white border-2 border-slate-300 hover:bg-slate-100 text-slate-800 font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
            <i data-lucide="send" class="w-5 h-5"></i>${selItem ? `${esc(pad2(selItem.index))}번 항목만 수정` : "전체 다시 생성"}
          </button>
        </section>`;
      }

      /* 다음 단계 결과가 이미 있으면 다시 생성하지 않고 그 단계로 이동합니다.
         다시 만들고 싶을 때는 각 단계의 '수정 지시'를 씁니다. */
      function nextDock(nextStep, generateLabel, generateAction, extra) {
        const ready = stepReady(nextStep);
        const stage = STAGES.find(x => x.n === nextStep);
        return dock(`${extra || ""}${ready
          ? primaryBtn(`${stage.label} 보기`, `setState({step:${nextStep}}, true)`)
          : primaryBtn(generateLabel, generateAction)}`);
      }

      /* 카드 번호와 같은 번호로 적어야 화면에서 근거를 바로 찾을 수 있습니다. */
      function sourceTitles(ids, list, key) {
        return list.filter(x => (ids || []).includes(x.id)).map(x => `${pad2(x.index)} ${x[key]}`).join(", ");
      }
      function sourceLine(label, ids, list, key) {
        const t = sourceTitles(ids, list, key);
        return t ? `<p class="t-meta text-teal-800 prose-ko">${esc(label)} · ${esc(t)}</p>` : "";
      }

      function sectionTitle(text, sub) {
        return `<h2 class="t-h1 text-slate-900 mb-2">${esc(text)}</h2>
          ${sub ? `<p class="t-small text-slate-600 mb-6 prose-ko">${esc(sub)}</p>` : `<div class="mb-6"></div>`}`;
      }

      /* =========================================================
         13. 텍스트 리포트
         ========================================================= */
      function buildReport() {
        const L = [];
        const line = "==================================================";
        const o = state.object;
        const e = state.emotion;
        L.push(line, "   사물 · 물성 · 지각 · 감성 분석 리포트", line, "");
        L.push("[분석 사물]", `- ${objectName() || "입력된 사물 없음"}${o && o.nameEn ? ` / ${o.nameEn}` : ""}`);
        L.push(`- 입력 방식: ${state.images.source ? "사진" : "키워드"}${state.keyword ? ` (${state.keyword})` : ""}`);
        L.push("- 분석 기준: 대부분의 사람이 일상에서 이 사물을 마주하는 보편적 상황", "");
        if (o) {
          L.push(line, " 1. 사물 개요", line, "");
          L.push(`${o.nameKo} · ${o.kind}`, `  ${o.summary}`);
          if (o.specimen) L.push(`  기준 표본: ${o.specimen}`);
          if (o.palette.length) L.push(`  관찰 색: ${o.palette.map(p => `${p.name || p.role} ${p.hex}`).join(", ")}`);
          L.push("");
        }
        if (state.properties.length) {
          L.push(line, " 2. 물성 분석", line);
          state.properties.forEach(p => {
            L.push("", `${pad2(p.index)}. [${p.axis}] ${p.titleKo} / ${p.titleEn} · 추정 ${p.level} (LOW 0 - HIGH 100 축에서 ${p.value})`);
            L.push(`  ${p.description}`);
            if (p.measure) L.push(`  측정·확인: ${p.measure}`);
          });
          L.push("");
        }
        if (state.perceptions.length) {
          L.push(line, " 3. 지각 분석 — 핵심 지각 경험", line);
          state.perceptions.forEach(p => {
            L.push("", `${pad2(p.index)}. ${p.moment} · ${p.titleKo} / ${p.titleEn}`);
            if (p.situation) L.push(`  상황: ${p.situation}`);
            L.push(`  ${p.description}`);
            if (p.cue) L.push(`  관찰 단서: ${p.cue}`);
          });
          L.push("");
        }
        if (e) {
          L.push(line, " 4. 감성 분석", line, "");
          L.push(`경험 감성 방향: ${e.nameKo} / ${e.nameEn}`);
          if (e.moodWords.length) L.push(`감성 단어: ${e.moodWords.join(" · ")}`);
          L.push(e.definition);
          if (e.trace) L.push(`지각에서 온 근거: ${e.trace}`);
          e.layers.forEach(l => {
            L.push("", `${pad2(l.index)}. [${l.phase}] ${l.nameKo} / ${l.nameEn} · 강도 ${l.intensity}/100`);
            L.push(`  ${l.description}`);
          });
          L.push("");
        }
        L.push(line, `생성 시각: ${nowLabel(Date.now())}`, line);
        return L.join("\n");
      }


      /* =========================================================
         13-B. PDF 리포트 — 블록 단위로 캡처해 A4에 배치합니다.
         ========================================================= */
      const PDF = {
        W: 794,
        ACCENT: "#0f766e",
        blk(inner, pad) {
          return `<div style="box-sizing:border-box;width:794px;padding:${pad || "0 0 14px 0"};background:#ffffff;font-family:'Pretendard',sans-serif;color:#0f172a;">${inner}</div>`;
        },
        heading(no, title, en) {
          return PDF.blk(`<div style="border-top:3px solid #0f172a;padding-top:12px;margin-top:18px;">
            <span style="font-size:22px;font-weight:800;">${esc(no)}</span>
            <span style="font-size:22px;font-weight:800;margin-left:8px;">${esc(title)}</span>
            <span style="font-size:16px;color:#64748b;margin-left:10px;">${esc(en)}</span>
          </div>`);
        },
        image(slot, caption, width) {
          const url = state.images && state.images[slot];
          if (!url) return "";
          return PDF.blk(`<img src="${escAttr(url)}" style="width:${width || 520}px;display:block;margin:0 auto 8px;border:1px solid #e2e8f0;" />
            <p style="font-size:14px;color:#64748b;text-align:center;margin:0;">${esc(caption)}</p>`);
        },
        card(inner) {
          return PDF.blk(`<div style="border:1px solid #cbd5e1;border-radius:14px;padding:16px 18px;">${inner}</div>`, "0 0 10px 0");
        },
        kv(k, v) {
          if (!v) return "";
          return `<div style="margin-top:8px;">
            <div style="font-size:14px;font-weight:700;color:#64748b;">${esc(k)}</div>
            <div style="font-size:16px;line-height:1.7;white-space:pre-line;">${esc(v)}</div>
          </div>`;
        },
        meta(k, v) {
          return v ? `<div style="font-size:14px;color:#64748b;margin-top:6px;">${esc(k)} · ${esc(v)}</div>` : "";
        },
        bar(value) {
          const pct = Math.max(2, Math.min(98, Number(value) || 55));
          return `<div style="position:relative;height:20px;margin:10px 0 4px;">
            <div style="position:absolute;left:34px;right:40px;top:9px;height:3px;background:#e2e8f0;border-radius:2px;"></div>
            <div style="position:absolute;left:0;top:2px;font-size:13px;color:#94a3b8;">LOW</div>
            <div style="position:absolute;right:0;top:2px;font-size:13px;color:#94a3b8;">HIGH</div>
            <div style="position:absolute;top:4px;left:calc(34px + (100% - 74px) * ${pct} / 100);width:13px;height:13px;margin-left:-6px;border-radius:50%;background:${PDF.ACCENT};"></div>
          </div>`;
        },
        palette(list) {
          if (!list || !list.length) return "";
          return `<div style="margin-top:12px;">${list.map(p => `<div style="display:inline-block;vertical-align:top;width:132px;margin:0 10px 8px 0;">
            <div style="height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:${escAttr(p.hex)};"></div>
            <div style="font-size:14px;font-weight:700;margin-top:4px;">${esc(p.name || p.role)}</div>
            <div style="font-size:13px;color:#64748b;">${esc(p.role)} ${esc(p.hex)}</div>
          </div>`).join("")}</div>`;
        },
        document() {
          const o = state.object;
          const out = [];

          out.push(PDF.blk(`<div style="padding-bottom:6px;">
            <div style="font-size:14px;letter-spacing:0.12em;color:#64748b;font-weight:700;">OBJECT EXPERIENCE LAB</div>
            <h1 style="font-size:30px;font-weight:800;margin:6px 0 10px;letter-spacing:-0.02em;">사물 · 물성 · 지각 · 감성 리포트</h1>
            <div style="font-size:20px;font-weight:700;">${esc(objectName() || "분석 사물 없음")}${o && o.nameEn ? ` <span style="font-size:16px;color:#64748b;font-weight:400;">${esc(o.nameEn)}</span>` : ""}</div>
            ${state.note ? `<div style="font-size:16px;color:#475569;margin-top:4px;">${esc(state.note)}</div>` : ""}
            <div style="font-size:14px;color:#64748b;margin-top:6px;">분석 기준 · 대부분의 사람이 일상에서 이 사물을 마주하는 보편적 상황</div>
            <div style="font-size:14px;color:#94a3b8;margin-top:10px;">${esc(nowLabel(Date.now()))}</div>
          </div>`));
          out.push(PDF.image("source", "분석한 사물 사진", 360));

          if (o) {
            out.push(PDF.heading("01", "사물 개요", "Object Overview"));
            out.push(PDF.card(`
              <div style="font-size:18px;font-weight:800;">${esc(o.nameKo)} <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(o.kind)}</span></div>
              <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(o.summary)}</div>
              ${PDF.meta("기준 표본", o.specimen)}
              ${PDF.palette(o.palette)}`));
          }

          if (state.properties.length) {
            out.push(PDF.heading("02", "물성 분석", "Physical Properties"));
            out.push(PDF.image("property", "물성 통합 이미지"));
            state.properties.forEach(p => {
              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(p.index)}  ${esc(p.titleKo)}
                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(p.axis)}</span></div>
                <div style="font-size:15px;color:#64748b;">${esc(p.titleEn)}</div>
                <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(p.description)}</div>
                ${PDF.bar(p.value)}
                <div style="font-size:14px;color:#64748b;">추정 수준 · ${esc(p.level)} (${esc(p.value)})</div>
                ${PDF.meta("측정·확인", p.measure)}
                ${PDF.meta("근거 사물 특징", sourceTitles(p.fromIds, state.traits, "titleKo"))}`));
            });
          }

          if (state.perceptions.length) {
            out.push(PDF.heading("03", "지각 분석", "Perception in Experience"));
            out.push(PDF.image("perception", "지각 분석 통합 이미지"));
            state.perceptions.forEach(p => {
              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(p.index)}  ${esc(p.titleKo)}
                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(p.moment)}</span></div>
                <div style="font-size:15px;color:#64748b;">${esc(p.titleEn)}</div>
                ${PDF.meta("상황", p.situation)}
                <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(p.description)}</div>
                ${PDF.meta("관찰 단서", p.cue)}
                ${PDF.meta("근거 물성", sourceTitles(p.fromIds, state.properties, "titleKo"))}`));
            });
          }

          if (state.emotion) {
            const e = state.emotion;
            out.push(PDF.heading("04", "감성 분석", "Experience-based Emotions"));
            out.push(PDF.card(`
              <div style="font-size:24px;font-weight:800;letter-spacing:-0.01em;">${esc(e.nameKo)}</div>
              <div style="font-size:15px;color:#64748b;">${esc(e.nameEn)}</div>
              <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(e.definition)}</div>
              ${e.moodWords.length ? `<div style="font-size:15px;color:${PDF.ACCENT};font-weight:700;margin-top:8px;">${esc(e.moodWords.join(" · "))}</div>` : ""}
              ${PDF.kv("지각에서 온 근거", e.trace)}`));
            out.push(PDF.image("emotion", "주요 감성 통합 이미지"));
            e.layers.forEach(l => {
              out.push(PDF.card(`
                <div style="font-size:18px;font-weight:800;">${pad2(l.index)}  ${esc(l.nameKo)}
                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(l.phase)}</span></div>
                <div style="font-size:15px;color:#64748b;">${esc(l.nameEn)}</div>
                <div style="font-size:16px;line-height:1.75;margin-top:8px;white-space:pre-line;">${esc(l.description)}</div>
                ${PDF.meta("상대 강도", `${l.intensity}/100`)}
                ${PDF.meta("근거 지각", sourceTitles(l.fromIds, state.perceptions, "titleKo"))}`));
            });
          }

          return out.filter(Boolean).join("");
        }
      };

      function waitForImages(root, timeoutMs) {
        const imgs = Array.from(root.querySelectorAll("img"));
        const all = Promise.all(imgs.map(im => (im.complete && im.naturalWidth)
          ? Promise.resolve()
          : new Promise(res => { im.onload = res; im.onerror = res; })));
        return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs || 6000))]);
      }

      function downloadText(name, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function exportPdf() {
        const h2c = window.html2canvas;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!h2c || !JsPDF) {
          toast("PDF 모듈을 불러오지 못했습니다. 텍스트로 내려받습니다.", "error");
          downloadText(`cmf-reverse-report-${Date.now()}.txt`, buildReport());
          return false;
        }

        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = `position:absolute;left:-10000px;top:0;width:${PDF.W}px;background:#ffffff;`;
        holder.innerHTML = PDF.document();
        document.body.appendChild(holder);

        try {
          await waitForImages(holder);
          if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 무시 */ } }

          const pdf = new JsPDF({ unit: "pt", format: "a4" });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const M = 34;
          const maxW = pw - M * 2;
          const maxH = ph - M * 2;
          let y = M;
          let placed = 0;

          for (const b of Array.from(holder.children)) {
            const canvas = await h2c(b, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
            if (!canvas.width || !canvas.height) continue;
            let w = maxW;
            let h = canvas.height * maxW / canvas.width;
            if (h > maxH) { h = maxH; w = canvas.width * maxH / canvas.height; }
            if (placed && y + h > ph - M) { pdf.addPage(); y = M; }
            pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (maxW - w) / 2, y, w, h);
            y += h + 6;
            placed += 1;
          }
          if (!placed) throw new Error("리포트에 담을 내용이 없습니다.");
          pdf.save(`사물-물성-지각-감성-리포트-${(objectName() || "무제").slice(0, 20)}.pdf`);
          return true;
        } finally {
          if (holder.parentNode) holder.parentNode.removeChild(holder);
        }
      }

      function copyText(text, okMsg, fileName) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => toast(okMsg))
            .catch(() => { if (fileName) downloadText(fileName, text); else toast("복사하지 못했습니다. 직접 선택해 복사해 주세요.", "error"); });
        } else if (fileName) {
          downloadText(fileName, text);
        } else {
          toast("이 브라우저는 복사를 지원하지 않습니다. 직접 선택해 복사해 주세요.", "error");
        }
      }

      /* =========================================================
         14. 단계별 수정 설정
         단계 이름(key)은 이미지 저장 슬롯 이름과 같습니다.
         ========================================================= */
      const EDIT = {
        property: {
          label: "물성",
          plural: "properties", singular: "property",
          list: () => state.properties,
          photo: true,
          downstream: () => state.perceptions.length > 0,
          downstreamText: "전체를 다시 생성하면 지각·감성 분석 결과가 지워집니다.",
          regenerateAll: ins => Actions.generateProperties(ins),
          prompt: (idx, ins) => PROMPTS.PROPERTY(state.object, state.traits, !!state.images.source, "")
            + singleEditBlock("물성", listProperties(state.properties), idx, ins, EDIT_FORMAT.property),
          norm: raw => normProperties({ properties: [raw] }, state.traits)[0] || null,
          replace: (idx, item) => { state.properties = state.properties.map(p => p.index === idx ? item : p); }
        },
        perception: {
          label: "지각",
          plural: "perceptions", singular: "perception",
          list: () => state.perceptions,
          photo: false,
          downstream: () => !!state.emotion,
          downstreamText: "전체를 다시 생성하면 감성 분석 결과가 지워집니다.",
          regenerateAll: ins => Actions.generatePerceptions(ins),
          prompt: (idx, ins) => PROMPTS.PERCEPTION(state.object, state.properties, "")
            + singleEditBlock("지각", listPerceptions(state.perceptions), idx, ins, EDIT_FORMAT.perception),
          /* 스타일 기본값이 원래 순번을 따르도록 앞자리를 채워 정규화합니다. */
          norm: raw => {
            const list = normPerceptions({ perceptions: [raw] }, state.properties);
            return list[0] || null;
          },
          replace: (idx, item) => { state.perceptions = state.perceptions.map(p => p.index === idx ? item : p); }
        },
        emotion: {
          label: "감성",
          plural: "emotions", singular: "emotion",
          list: () => (state.emotion ? state.emotion.layers : []),
          photo: false,
          downstream: () => false,
          downstreamText: "",
          regenerateAll: ins => Actions.generateEmotion(ins),
          prompt: (idx, ins) => PROMPTS.EMOTION(state.object, state.perceptions, "")
            + singleEditBlock("감성", listEmotions(state.emotion.layers), idx, ins, EDIT_FORMAT.emotion),
          norm: raw => normLayers([raw], state.perceptions)[0] || null,
          replace: (idx, item) => {
            state.emotion = Object.assign({}, state.emotion, {
              layers: state.emotion.layers.map(l => l.index === idx ? item : l)
            });
          }
        }
      };

      /* =========================================================
         15. ACTIONS
         ========================================================= */
      const Actions = {
        /* ---- 접속 / 프로젝트 ---- */
        validateKey() {
          const el = document.getElementById("api-input");
          const key = el ? el.value.trim() : "";
          if (!key) { setState({ errorMsg: "API 키를 입력해 주세요." }); return; }
          if (!/^sk-/.test(key)) { setState({ errorMsg: "OpenAI API 키는 sk- 로 시작합니다. 키를 다시 확인해 주세요." }); return; }
          state.apiKey = key;
          saveSession();
          setState({ step: 0, errorMsg: null }, true);
        },
        pickQuality(id) { state.quality = id; saveSession(); render(); },
        pickLabelLang(id) { state.labelLang = id; saveSession(); render(); },
        toggleSettings() { setState({ settingsOpen: !state.settingsOpen }); },

        startNewProject() {
          persist(false);
          Object.assign(state, blankProject());
          drafts["keyword-input"] = "";
          drafts["note-input"] = "";
          resetEditDrafts();
          setState({ step: 1 }, true);
        },

        async openProject(id) {
          if (opening) return;
          opening = true;
          let row;
          try {
            /* 지금 열려 있던 프로젝트를 먼저 끝까지 저장한 뒤, 저장소에서 가장 최근 기록을 읽습니다. */
            await persist(false);
            await Store.queue;
            row = await Store.fetchLatest(id);
          } finally { opening = false; }
          if (!row || !row.data) { toast("프로젝트를 찾지 못했습니다.", "error"); return; }
          const d = JSON.parse(JSON.stringify(row.data));
          Object.assign(state, blankProject(), {
            projectId: d.projectId || row.id,
            keyword: d.keyword || "",
            note: d.note || "",
            hasPhoto: !!d.hasPhoto,
            object: d.object || null,
            traits: arr(d.traits),
            properties: arr(d.properties),
            perceptions: arr(d.perceptions),
            emotion: d.emotion && arr(d.emotion.layers).length ? d.emotion : null,
            synthesis: d.synthesis || null,
            createdAt: d.createdAt || row.savedAt
          });
          drafts["keyword-input"] = state.keyword;
          drafts["note-input"] = state.note;
          resetEditDrafts();
          let step = Math.min(Math.max(1, d.step || 1), STAGES.length);
          while (step > 1 && !stepReady(step)) step -= 1;
          setState({ step }, true);
          const imgs = await ImageDB.loadAll(state.projectId);
          if (state.projectId !== (d.projectId || row.id)) return; /* 그 사이 다른 프로젝트를 열었으면 무시 */
          setState({ images: imgs });
          if (d.hasPhoto && !imgs.source) toast("저장된 사진을 불러오지 못했습니다. 분석 결과는 그대로 남아 있습니다.", "error");
        },

        async deleteProject(id) {
          if (!window.confirm("이 프로젝트와 사진, 생성된 이미지를 모두 지웁니다. 계속할까요?")) return;
          await Store.remove(id);
          if (state.projectId === id) { Object.assign(state, blankProject()); resetEditDrafts(); }
          toast("프로젝트를 삭제했습니다.");
          render();
        },

        goHome() {
          setState({ step: 0 }, true);
          persist(false).then(() => Store.queue).then(() => Store.refresh()).then(() => { if (state.step === 0) render(); });
        },
        saveNow() { persist(true); },

        copyReport() { copyText(buildReport(), "리포트를 클립보드에 복사했습니다.", "cmf-reverse-report.txt"); },
        async exportPdf() {
          setState({ isAnalyzing: true, loadingMsg: "리포트를 PDF로 만들고 있습니다", errorMsg: null });
          try {
            const ok = await exportPdf();
            setState({ isAnalyzing: false });
            if (ok) toast("PDF를 내려받았습니다.");
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: "PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요." });
          }
        },

        cancel() { if (activeController) activeController.abort(); },

        /* ---- 이미지 공통 ---- */
        openLightbox(slot) { setState({ lightbox: slot }); },
        closeLightbox() { setState({ lightbox: null }); },
        downloadImage(slot) {
          const url = state.images[slot];
          if (!url) return;
          const ext = /^data:image\/jpe?g/i.test(url) ? "jpg" : "png";
          const a = document.createElement("a");
          a.href = url;
          a.download = `cmf-reverse-${slot}-${Date.now()}.${ext}`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        },
        async saveImage(slot, url) {
          const projectId = state.projectId;
          const stored = slot === "source" ? url : await toStorableImage(url);
          if (state.projectId !== projectId) return;
          state.images = Object.assign({}, state.images, { [slot]: stored });
          const ok = await ImageDB.put(projectId, slot, stored);
          if (!ok) toast("이미지를 기기에 저장하지 못했습니다. 지금 화면에서는 그대로 쓸 수 있습니다.", "error");
        },

        /* ---- 1단계 : 사물 입력 ---- */
        pickSample(i) {
          const w = SAMPLE_OBJECTS[i];
          if (!w) return;
          setDraft("keyword-input", w);
          render();
        },
        async onPhotoPicked(input) {
          const file = input && input.files && input.files[0];
          if (!file) return;
          try { input.value = ""; } catch (e) { /* 일부 브라우저는 읽기 전용 */ }
          setState({ isAnalyzing: true, loadingMsg: "사진을 준비하고 있습니다", errorMsg: null });
          try {
            const dataUrl = await preparePhoto(file);
            await Actions.saveImage("source", dataUrl);
            setState({ isAnalyzing: false });
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: err.message || "사진을 불러오지 못했습니다." });
          }
        },
        removePhoto() {
          clearImages(["source"]);
          render();
        },

        /* 이미 결과가 있는 프로젝트에서 입력을 바꿔 처음부터 다시 분석합니다. */
        restartAnalysis() {
          if (state.properties.length && !window.confirm("지금까지의 물성·지각·감성 결과를 지우고 새 입력으로 다시 분석합니다. 계속할까요?")) return;
          resetEditDrafts();
          Actions.generateObject();
        },

        /* ---- 1단계 실행 : 사물 특징을 내부 분석한 뒤 바로 물성 분석으로 이동 ---- */
        async generateObject(instruction) {
          const kw = (drafts["keyword-input"] !== undefined ? drafts["keyword-input"] : state.keyword).trim();
          const note = (drafts["note-input"] !== undefined ? drafts["note-input"] : state.note).trim();
          const photo = state.images.source;
          if (!kw && !photo) { setState({ errorMsg: "사진을 찍거나 올리고, 사진이 없으면 사물 키워드를 입력해 주세요." }); return false; }
          state.keyword = kw;
          state.note = note;

          const data = await withLoading(photo ? "사진 속 사물의 전체 특징을 분석하고 있습니다" : "사물의 전체 특징을 분석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.OBJECT(kw, note, !!photo, instruction || ""), photo));
          if (!data) return false;

          const traits = normTraits(data);
          if (!traits.length) { setState({ errorMsg: "사물 특징 분석을 받지 못했습니다. 다시 시도해 주세요." }); return false; }

          clearImages(["cmf", "property", "perception", "emotion"]);
          resetEditDrafts();
          setState({
            object: normObject(data, kw),
            hasPhoto: !!photo,
            traits,
            properties: [],
            perceptions: [],
            emotion: null,
            synthesis: null,
            step: 1
          }, true);
          persist(false);
          return Actions.generateProperties();
        },

        /* ---- 2단계 : 물성 분석 ---- */
        async generateProperties(instruction) {
          const o = state.object;
          if (!o || !state.traits.length) { setState({ errorMsg: "사물 특징 분석을 먼저 진행해 주세요." }); return false; }
          const photo = state.images.source;

          const data = await withLoading("사물의 특징에서 중요한 물성을 읽어 내고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PROPERTY(o, state.traits, !!photo, instruction || ""), photo));
          if (!data) return false;

          const properties = normProperties(data, state.traits);
          if (!properties.length) { setState({ errorMsg: "물성 분석을 받지 못했습니다. 다시 시도해 주세요." }); return false; }

          clearImages(["property", "perception", "emotion"]);
          ["perception", "emotion"].forEach(k => { delete drafts[`ins-${k}`]; delete drafts[`sel-${k}`]; });
          setState({ properties, perceptions: [], emotion: null, synthesis: null, step: 2 }, true);
          persist(false);
          await Actions.generatePropertyImage();
          return true;
        },
        async generatePropertyImage() {
          if (!state.properties.length) return false;
          const url = await withLoading("물성 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.property(state.properties)));
          if (!url) return false;
          await Actions.saveImage("property", url);
          render();
          return true;
        },

        /* ---- 3단계 : 지각 분석 ---- */
        async generatePerceptions(instruction) {
          const o = state.object;
          if (!o || !state.properties.length) { setState({ errorMsg: "물성 분석을 먼저 진행해 주세요." }); return false; }

          const data = await withLoading("사람이 무엇을 지각하게 되는지 정리하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PERCEPTION(o, state.properties, instruction || "")));
          if (!data) return false;

          const perceptions = normPerceptions(data, state.properties);
          if (!perceptions.length) { setState({ errorMsg: "지각 분석을 받지 못했습니다. 다시 시도해 주세요." }); return false; }

          clearImages(["perception", "emotion"]);
          delete drafts["ins-emotion"]; delete drafts["sel-emotion"];
          setState({ perceptions, emotion: null, synthesis: null, step: 3 }, true);
          persist(false);
          await Actions.generatePerceptionImage();
          return true;
        },
        async generatePerceptionImage() {
          if (!state.perceptions.length) return false;
          const url = await withLoading("지각 분석 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.perception(state.perceptions)));
          if (!url) return false;
          await Actions.saveImage("perception", url);
          render();
          return true;
        },

        /* ---- 4단계 : 감성 분석 ---- */
        async generateEmotion(instruction) {
          const o = state.object;
          if (!o || !state.perceptions.length) { setState({ errorMsg: "지각 분석을 먼저 진행해 주세요." }); return false; }

          const data = await withLoading("지각이 어떤 감성으로 이어지는지 분석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.EMOTION(o, state.perceptions, instruction || "")));
          if (!data) return false;

          const emotion = normEmotion(data, state.perceptions);
          if (!emotion) { setState({ errorMsg: "감성 분석을 받지 못했습니다. 다시 시도해 주세요." }); return false; }

          clearImages(["emotion"]);
          setState({ emotion, synthesis: null, step: 4 }, true);
          persist(false);
          await Actions.generateEmotionImage();
          return true;
        },
        async generateEmotionImage() {
          if (!state.emotion || !state.emotion.layers.length) return false;
          const url = await withLoading("주요 감성 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.emotion(state.emotion)));
          if (!url) return false;
          await Actions.saveImage("emotion", url);
          render();
          return true;
        },

        /* ---- 수정 지시 : 항목 선택 / 실행 ---- */
        pickEditTarget(key, val) {
          drafts[`sel-${key}`] = val === "all" ? "all" : Number(val);
          render();
        },

        async applyEdit(key) {
          const cfg = EDIT[key];
          if (!cfg || state.isAnalyzing) return;
          const items = cfg.list();
          const insId = `ins-${key}`;
          const ins = draft(insId).trim();
          const target = currentTarget(key, items);
          let ok = false;
          if (target === "all") {
            if (cfg.downstream() && !window.confirm(`${cfg.downstreamText} 계속할까요?`)) return;
            ok = await cfg.regenerateAll(ins);
            if (ok) drafts[`sel-${key}`] = "all";
          } else {
            ok = await Actions.editOne(key, target, ins);
          }
          if (ok) { drafts[insId] = ""; render(); }
        },

        /* 선택한 항목 하나만 다시 분석하고, 통합 이미지는 해당 칸만 편집합니다.
           다른 항목과 다음 단계 결과는 그대로 둡니다. */
        async editOne(key, idx, ins) {
          const cfg = EDIT[key];
          const old = cfg.list().find(x => x.index === idx);
          if (!old || !state.object) { setState({ errorMsg: "수정할 항목을 찾지 못했습니다." }); return false; }
          const projectId = state.projectId;

          const data = await withLoading(`${pad2(idx)}번 ${cfg.label} 항목만 다시 분석하고 있습니다`, () =>
            callText(SYSTEM, cfg.prompt(idx, ins), cfg.photo ? state.images.source : null));
          if (!data || state.projectId !== projectId) return false;

          const raw = pickItem(data, cfg.plural, cfg.singular);
          if (!raw || typeof raw !== "object" || !(raw.titleKo || raw.nameKo)) {
            setState({ errorMsg: "수정된 항목을 받지 못했습니다. 다시 시도해 주세요." });
            return false;
          }
          const item = cfg.norm(raw);
          if (!item) { setState({ errorMsg: "수정된 항목을 해석하지 못했습니다. 다시 시도해 주세요." }); return false; }
          /* 번호와 id를 그대로 두어야 다음 단계의 '근거' 연결이 끊기지 않습니다. */
          item.index = idx;
          item.id = old.id || item.id;
          if (key !== "property" && !raw.style && old.style) item.style = old.style;
          cfg.replace(idx, item);
          render();
          persist(false);

          await Actions.editBoardCell(key, idx);
          toast(`${pad2(idx)}번 ${cfg.label} 항목만 수정했습니다. 다른 항목은 그대로 유지됩니다.`);
          return true;
        },

        async editBoardCell(key, idx) {
          const slot = key;
          const existing = state.images[slot];
          const projectId = state.projectId;
          /* 아직 통합 이미지가 없으면 새로 한 장을 만듭니다. */
          if (!existing) {
            const made = await withLoading("통합 이미지를 만들고 있습니다", () => callImage(IMG.board(key)));
            if (!made || state.projectId !== projectId) return false;
            await Actions.saveImage(slot, made);
            render();
            return true;
          }
          let usedFallback = false;
          const url = await withLoading(`통합 이미지에서 ${pad2(idx)}번 칸만 고치고 있습니다`, async () => {
            try {
              return await callImageEdit(IMG.edit(key, idx), existing);
            } catch (err) {
              if (err && (err.aborted || err.fatal)) throw err;
              console.warn("부분 편집에 실패해 통합 이미지를 다시 만듭니다.", err);
              usedFallback = true;
              state.loadingMsg = "부분 편집이 지원되지 않아 통합 이미지를 다시 만들고 있습니다";
              render();
              return await callImage(IMG.board(key));
            }
          });
          if (!url || state.projectId !== projectId) return false;
          await Actions.saveImage(slot, url);
          render();
          if (usedFallback) toast("부분 편집이 지원되지 않아 통합 이미지 전체를 다시 만들었습니다.");
          return true;
        }
      };
      window.Actions = Actions;

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("물성 분석", 1)}
          ${sectionTitle("이 사물의 중요한 물성", "보이는 성질, 만져지는 성질, 구조·힘·무게·움직임·반응·온도·소리·시간 변화까지 사용자 경험에 영향을 주는 핵심 물성을 정리했습니다.")}

          ${imageCard("property", {
            title: "물성 통합 이미지",
            alt: "물성별 대표 표면·광학·촉감 이미지 보드",
            empty: "물성 통합 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePropertyImage()"
          })}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("property", state.properties, {
            titleKey: "titleKo",
            placeholder: "예: 시간이 지나며 변하는 물성을 더 분명하게 다뤄 주세요",
            downstreamNote: state.perceptions.length ? "전체를 다시 생성하면 지각·감성 분석 결과가 지워집니다." : ""
          })}

          ${nextDock(3, "지각 분석", "Actions.generatePerceptions()")}
        </div>`;
      }

      /* ---- 3단계 : 지각 분석 ---- */
      function viewPerception() {
        const tgt = currentTarget("perception", state.perceptions);
        const cards = state.perceptions.map(p => infoCard({
          index: p.index,
          title: p.titleKo,
          subtitle: p.titleEn,
          badge: p.moment,
          active: tgt === p.index,
          body: `
            ${p.situation ? `<p class="t-meta font-bold text-teal-800 prose-ko">${esc(p.situation)}</p>` : ""}
            <p class="t-small text-slate-700 prose-ko">${esc(p.description)}</p>
            ${p.cue ? `<p class="t-meta text-slate-500 prose-ko">관찰 단서 · ${esc(p.cue)}</p>` : ""}
            ${sourceLine("근거 물성", p.fromIds, state.properties, "titleKo")}`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("지각 분석", 2)}
          ${sectionTitle("이 사물을 통해 무엇을 지각하게 되는가", "순간적인 첫 느낌부터 접촉·움직임·사용 과정에서 누적되는 경험적 지각까지, 이 사물에서 중요하게 감지되는 것을 정리했습니다.")}

          ${imageCard("perception", {
            title: "지각 분석 통합 이미지",
            alt: "지각 특성을 영감 관점으로 표현한 디자인 매거진 스타일 이미지",
            empty: "지각 분석 영감 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePerceptionImage()"
          })}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("perception", state.perceptions, {
            titleKey: "titleKo",
            placeholder: "예: 자연 이미지 반복을 줄이고 접촉 반응·공간 깊이·시간적 회복이 더 분명하도록 다시 구성해 주세요",
            downstreamNote: state.emotion ? "전체를 다시 생성하면 감성 분석 결과가 지워집니다." : ""
          })}

          ${nextDock(4, "감성 분석", "Actions.generateEmotion()")}
        </div>`;
      }

      /* ---- 4단계 : 감성 분석 ---- */
      function viewEmotion() {
        const e = state.emotion;
        const tgt = currentTarget("emotion", e.layers);
        const layers = e.layers.map(l => infoCard({
          index: l.index,
          title: l.nameKo,
          subtitle: l.nameEn,
          badge: `강도 ${l.intensity}`,
          active: tgt === l.index,
          body: `
            <p class="t-small text-slate-700 prose-ko">${esc(l.description)}</p>
            <p class="t-meta text-slate-500">감성 강도 · ${esc(l.intensity)}/100</p>
            ${sourceLine("근거 지각", l.fromIds, state.perceptions, "titleKo")}`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("감성 분석", 3)}
          ${sectionTitle("어떤 경험의 감성을 갖게 되는가", "지각 경험을 바탕으로 사용자가 최종적으로 갖게 되는 대표 감성 키워드 2개를 정리했습니다.")}

          <section class="bg-white rounded-[2rem] p-6 border-2 border-teal-700 shadow-lg mb-6">
            <p class="t-meta font-bold text-teal-800 mb-1">경험 감성 방향</p>
            <h3 class="t-h1 text-slate-900">${esc(e.nameKo)}</h3>
            ${e.nameEn ? `<p class="t-meta text-slate-500 mb-3">${esc(e.nameEn)}</p>` : `<div class="mb-3"></div>`}
            <p class="t-small text-slate-700 prose-ko">${esc(e.definition)}</p>
            ${e.moodWords.length ? `<div class="flex flex-wrap gap-1.5 pt-3">${e.moodWords.map(w => chip(w, "accent")).join("")}</div>` : ""}
            ${e.trace ? `<p class="t-meta text-slate-600 prose-ko mt-4 pt-4 border-t border-slate-100">지각에서 온 근거 · ${esc(e.trace)}</p>` : ""}
          </section>

          ${imageCard("emotion", {
            title: "대표 감성 키워드 이미지",
            alt: "사물 경험에서 도출된 주요 감성들의 무드 이미지",
            empty: "대표 감성 키워드 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateEmotionImage()"
          })}

          <h3 class="t-h3 text-slate-900 mb-3 px-1">대표 감성 키워드 ${e.layers.length}개</h3>
          <div class="space-y-3">${layers}</div>
          ${instructionBox("emotion", e.layers, {
            titleKey: "nameKo",
            placeholder: "예: 서로 상반된 지각이 만드는 긴장감을 감성 정의에 더 반영해 주세요",
            downstreamNote: ""
          })}

          ${dock(primaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()"))}
        </div>`;
      }

      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2 w-full prose-center">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-2 w-full prose-center">1분 넘게 걸릴 수 있습니다</p>
            <p class="t-small text-slate-600 mb-8 w-full prose-center">처리 중에는 화면을 켜 두고 다른 앱으로 전환하지 마세요</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.lightbox && state.images && state.images[state.lightbox]) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/90 flex flex-col max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
            <div class="flex justify-between items-center p-3">
              <button type="button" onclick="Actions.downloadImage('${escAttr(state.lightbox)}')" class="px-4 py-2.5 rounded-full bg-white/10 text-white font-bold t-meta inline-flex items-center gap-1.5"><i data-lucide="download" class="w-5 h-5"></i>내려받기</button>
              <button type="button" onclick="Actions.closeLightbox()" aria-label="닫기" class="p-3 rounded-full bg-white/10 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-auto px-3 pb-6 no-scrollbar">
              <img src="${escAttr(state.images[state.lightbox])}" alt="확대한 이미지" class="w-full rounded-2xl" />
            </div>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6 prose-center">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && el.type !== "file")
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 */ }
          }
        }
        try { window.scrollTo(0, resetScroll ? 0 : snap.scrollY); } catch (e) { /* 무시 */ }
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}}, true)`)}
          </div>
        </div>`;
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewInput();
          case 2:  return state.properties.length ? viewProperty() : fallback(1, "분석된 물성이 없습니다.");
          case 3:  return state.perceptions.length ? viewPerception() : fallback(2, "분석된 지각이 없습니다.");
          case 4:  return state.emotion && state.emotion.layers.length ? viewEmotion() : fallback(3, "분석된 감성이 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        if (state.step >= 1) lastWorkStep = state.step;
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.lightbox) Actions.closeLightbox();
        else if (state.isAnalyzing) Actions.cancel();
      });

      setInterval(() => { persist(false); }, CONFIG.AUTOSAVE_MS);
      /* 모바일·앱(WebView)은 창을 닫을 때 beforeunload가 오지 않는 경우가 많아
         화면이 가려지는 순간에도 바로 저장합니다. */
      window.addEventListener("beforeunload", () => { persist(false); });
      window.addEventListener("pagehide", () => { persist(false); });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") persist(false); });

      loadSession();
      if (state.apiKey) state.step = 0;
      render(true);

      Store.init()
        .catch(e => { console.warn("저장소 초기화 실패", e); Store.ready = true; })
        .then(() => { if (state.step === 0) render(); });
    })();
  </script>
</body>
</html>
