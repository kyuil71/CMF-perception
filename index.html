      function waitForImages(root, timeoutMs) {
        const imgs = Array.from(root.querySelectorAll("img"));
        const all = Promise.all(imgs.map(im => (im.complete && im.naturalWidth)
          ? Promise.resolve()
          : new Promise(res => { im.onload = res; im.onerror = res; })));
        return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs || 6000))]);
      }

      function downloadText(name, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function exportPdf() {
        const h2c = window.html2canvas;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!h2c || !JsPDF) {
          toast("PDF 모듈을 불러오지 못했습니다. 텍스트로 내려받습니다.", "error");
          downloadText(`cmf-reverse-report-${Date.now()}.txt`, buildReport());
          return false;
        }

        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = `position:absolute;left:-10000px;top:0;width:${PDF.W}px;background:#ffffff;`;
        holder.innerHTML = PDF.document();
        document.body.appendChild(holder);

        try {
          await waitForImages(holder);
          if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 무시 */ } }

          const pdf = new JsPDF({ unit: "pt", format: "a4" });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const M = 34;
          const maxW = pw - M * 2;
          const maxH = ph - M * 2;
          let y = M;
          let placed = 0;

          for (const b of Array.from(holder.children)) {
            const canvas = await h2c(b, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
            let w = maxW;
            let h = canvas.height * maxW / canvas.width;
            if (h > maxH) { h = maxH; w = canvas.width * maxH / canvas.height; }
            if (placed && y + h > ph - M) { pdf.addPage(); y = M; }
            pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (maxW - w) / 2, y, w, h);
            y += h + 6;
            placed += 1;
          }
          if (!placed) throw new Error("리포트에 담을 내용이 없습니다.");
          pdf.save(`사물-물성-지각-감성-리포트-${(objectName() || "무제").slice(0, 20)}.pdf`);
          return true;
        } finally {
          if (holder.parentNode) holder.parentNode.removeChild(holder);
        }
      }

      function copyText(text, okMsg, fileName) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => toast(okMsg))
            .catch(() => { if (fileName) downloadText(fileName, text); else toast("복사하지 못했습니다. 직접 선택해 복사해 주세요.", "error"); });
        } else if (fileName) {
          downloadText(fileName, text);
        } else {
          toast("이 브라우저는 복사를 지원하지 않습니다. 직접 선택해 복사해 주세요.", "error");
        }
      }

      /* =========================================================
         14. ACTIONS
         ========================================================= */
      const Actions = {
        /* ---- 접속 / 프로젝트 ---- */
        validateKey() {
          const el = document.getElementById("api-input");
          const key = el ? el.value.trim() : "";
          if (!key) { setState({ errorMsg: "API 키를 입력해 주세요." }); return; }
          if (!/^sk-/.test(key)) { setState({ errorMsg: "OpenAI API 키는 sk- 로 시작합니다. 키를 다시 확인해 주세요." }); return; }
          state.apiKey = key;
          saveSession();
          setState({ step: 0, errorMsg: null }, true);
        },
        pickQuality(id) { state.quality = id; saveSession(); render(); },
        async pickLabelLang(id) {
          if (state.labelLang === id) return;
          state.labelLang = id;
          saveSession();
          render();
          /* 라벨은 앱이 그리므로 이미 만든 보드도 API 호출 없이 바로 다시 그립니다. */
          for (const s of Object.keys(BOARD_STAGES)) {
            if (state.boardKind && state.boardKind[s] === "items" && stageItems(s).length) {
              try { await rebuildBoard(s); } catch (e) { console.warn(e); }
            }
          }
          render();
        },

        startNewProject() {
          persist(false);
          Object.assign(state, blankProject());
          lastSavedJson = "";
          Object.keys(drafts).forEach(k => { delete drafts[k]; });
          setState({ step: 1 }, true);
        },

        async openProject(id) {
          if (state.isAnalyzing) return;
          const row = Store.list().find(p => p.id === id);
          if (!row || !row.data) { toast("프로젝트를 찾지 못했습니다.", "error"); render(); return; }
          persist(false);
          const d = row.data;
          Object.assign(state, blankProject(), {
            projectId: d.projectId || row.id,
            keyword: d.keyword || "",
            note: d.note || "",
            hasPhoto: !!d.hasPhoto,
            object: d.object || null,
            traits: arr(d.traits),
            properties: arr(d.properties),
            perceptions: arr(d.perceptions),
            emotion: d.emotion && Array.isArray(d.emotion.layers) ? d.emotion : null,
            boardKind: d.boardKind && typeof d.boardKind === "object" ? d.boardKind : {},
            createdAt: d.createdAt || row.savedAt
          });
          /* 이전 버전 데이터의 감성 항목에는 id가 없어 개별 수정용 id를 붙입니다. */
          if (state.emotion) state.emotion.layers.forEach(l => { if (!l.id) l.id = uid("emo"); });
          Object.keys(drafts).forEach(k => { delete drafts[k]; });
          drafts["keyword-input"] = state.keyword;
          const pid = state.projectId;
          let step = Math.min(Math.max(1, d.step || 1), STAGES.length);
          while (step > 1 && !stepReady(step)) step -= 1;
          /* 글은 저장된 그대로 보여 주고, 이미지는 불러오는 동안 '불러오는 중'으로 표시합니다. */
          lastSavedJson = "";
          setState({ step, imagesLoading: true }, true);
          const loaded = await ImageDB.loadAll(pid);
          if (state.projectId !== pid) return;
          /* 데이터가 없는 단계의 이미지는 복원하지 않고 정리합니다. (참고 프로그램과 같은 처리) */
          const orphan = Object.keys(BOARD_STAGES).filter(s => !stageItems(s).length);
          orphan.forEach(s => {
            if (loaded.images[s]) { loaded.images[s] = null; ImageDB.remove(pid, s); }
            if (Object.keys(loaded.itemImages[s] || {}).length) { loaded.itemImages[s] = {}; ImageDB.removePrefix(`${pid}::item::${s}::`); }
          });
          state.images = loaded.images;
          state.itemImages = loaded.itemImages;
          let restored = 0;
          for (const stage of Object.keys(BOARD_STAGES)) {
            const items = stageItems(stage);
            const hasItemImg = items.some(it => itemImg(stage, it.id));
            if (items.length && hasItemImg && !state.images[stage]) {
              try { await rebuildBoard(stage); restored += 1; } catch (e) { console.warn("보드 복원 실패", stage, e); }
              if (state.projectId !== pid) return;
            }
          }
          setState({ imagesLoading: false });
          if (restored) persist(false);
          if (loaded.failed) toast("저장된 이미지를 불러오지 못했습니다. 분석 내용은 그대로 남아 있습니다.", "error");
          else if (d.hasPhoto && !loaded.images.source) toast("저장된 사진을 찾지 못했습니다. 분석 내용은 그대로 남아 있습니다.", "error");
        },

        async deleteProject(id) {
          if (!window.confirm("이 프로젝트와 사진, 생성된 이미지를 모두 지웁니다. 계속할까요?")) return;
          Store.remove(id);
          if (state.projectId === id) { Object.assign(state, blankProject()); lastSavedJson = ""; }
          toast("프로젝트를 삭제했습니다.");
          render();
        },

        goHome() { persist(false); setState({ step: 0 }, true); },
        saveNow() { const r = persist(true); if (r === "empty") toast("아직 저장할 내용이 없습니다."); },

        copyReport() { copyText(buildReport(), "리포트를 클립보드에 복사했습니다.", "cmf-reverse-report.txt"); },
        async exportPdf() {
          setState({ isAnalyzing: true, loadingMsg: "리포트를 PDF로 만들고 있습니다", errorMsg: null });
          try {
            const ok = await exportPdf();
            setState({ isAnalyzing: false });
            if (ok) toast("PDF를 내려받았습니다.");
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: "PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요." });
          }
        },

        cancel() { if (activeController) activeController.abort(); },

        /* ---- 이미지 공통 ---- */
        openLightbox(slot) { setState({ lightbox: slot }); },
        closeLightbox() { setState({ lightbox: null }); },
        downloadImage(slot) {
          const url = state.images[slot];
          if (!url) return;
          const ext = /^data:image\/png/i.test(url) ? "png" : "jpg";
          const a = document.createElement("a");
          a.href = url;
          a.download = `cmf-reverse-${slot}-${Date.now()}.${ext}`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        },
        async saveImage(slot, dataUrl) {
          state.images = Object.assign({}, state.images, { [slot]: dataUrl });
          await storeImage(slot, dataUrl);
        },

        /* 항목별 이미지를 만들고 보드를 다시 그립니다. ids가 없으면 모든 항목을 만듭니다. */
        async buildStageImages(stage, ids) {
          const items = stageItems(stage);
          if (!items.length) return;
          const jobs = items.map((item, i) => ({ item, i })).filter(j => !ids || ids.includes(j.item.id));
          const base = `${STAGE_LABEL[stage]} 이미지를 만들고 있습니다`;
          const res = await withLoading(jobs.length ? `${base} (0/${jobs.length})` : "보드를 정리하고 있습니다", async () => {
            const r = jobs.length
              ? await generateItemImages(stage, jobs, done => { state.loadingMsg = `${base} (${done}/${jobs.length})`; render(); })
              : { failed: 0, lastErr: "" };
            await rebuildBoard(stage);
            return r;
          });
          persist(false);
          render();
          if (res && res.fatal) {
            persist(false);
            setState({ step: -1, errorMsg: res.lastErr || "API 키를 다시 확인해 주세요." }, true);
            return;
          }
          if (res && res.failed) {
            setState({ errorMsg: `이미지 ${res.failed}장을 만들지 못했습니다. 이미지 칸의 '빠진 이미지 만들기'로 다시 시도해 주세요.${res.lastErr ? `\n(${res.lastErr})` : ""}` });
          }
        },
        async buildMissing(stage) {
          const ids = stageItems(stage).filter(it => !itemImg(stage, it.id)).map(it => it.id);
          await Actions.buildStageImages(stage, ids);
        },
        /* ---- 1단계 : 사물 입력 ---- */
        async onPhotoPicked(input) {
          const file = input && input.files && input.files[0];
          if (!file) return;
          try { input.value = ""; } catch (e) { /* 일부 브라우저는 읽기 전용 */ }
          setState({ isAnalyzing: true, loadingMsg: "사진을 준비하고 있습니다", errorMsg: null });
          try {
            const dataUrl = await preparePhoto(file);
            await Actions.saveImage("source", dataUrl);
            setState({ isAnalyzing: false });
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: err.message || "사진을 불러오지 못했습니다." });
          }
        },
        removePhoto() {
          state.images = Object.assign({}, state.images, { source: null });
          ImageDB.remove(state.projectId, "source");
          render();
        },

        /* 하단 버튼은 항상 다음 단계를 새로 분석합니다. 지난 결과를 보기만 할 때는 상단 좌우 꺽쇠를 씁니다.
           이미 결과가 있으면 지워지는 범위를 알려 주고 확인을 받습니다. */
        async runNext(n) {
          if (state.isAnalyzing) return;
          const names = { 2: "물성·지각·감성", 3: "지각·감성", 4: "감성" };
          if (stepReady(n) && !window.confirm(`이미 분석한 결과가 있습니다. 새로 분석하면 기존 ${names[n]} 결과와 이미지가 새로 만들어집니다. 계속할까요?`)) return;
          if (n === 2) await Actions.generateObject();
          else if (n === 3) await Actions.generatePerceptions();
          else if (n === 4) await Actions.generateEmotion();
        },

        /* ---- 1단계 실행 : 사물 특징을 내부 분석한 뒤 바로 물성 분석으로 이동 ---- */
        async generateObject() {
          const kw = (drafts["keyword-input"] !== undefined ? drafts["keyword-input"] : state.keyword).trim();
          const photo = state.images.source;
          if (!kw && !photo) { setState({ errorMsg: "사진을 찍거나 올리고, 사진이 없으면 사물 키워드를 입력해 주세요." }); return; }
          state.keyword = kw;

          const data = await withLoading(photo ? "사진 속 사물의 전체 특징을 분석하고 있습니다" : "사물의 전체 특징을 분석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.OBJECT(kw, state.note, !!photo, ""), photo));
          if (!data) return;

          const traits = normTraits(data);
          if (!traits.length) { setState({ errorMsg: "사물 특징 분석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          clearStages(["property", "perception", "emotion"]);
          setState({
            object: normObject(data, kw),
            hasPhoto: !!photo,
            traits,
            properties: [],
            perceptions: [],
            emotion: null,
            editSel: {},
            step: 1
          }, true);
          persist(false);
          await Actions.generateProperties();
        },

        /* ---- 2단계 : 물성 분석 (전체) ---- */
        async generateProperties(instruction) {
          const o = state.object;
          if (!o || !state.traits.length) { setState({ errorMsg: "사물 특징 분석을 먼저 진행해 주세요." }); return; }
          const photo = state.images.source;

          const data = await withLoading("사물의 특징에서 중요한 물성을 읽어 내고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PROPERTY(o, state.traits, !!photo, instruction || ""), photo));
          if (!data) return;

          const properties = normProperties(data, state.traits);
          if (!properties.length) { setState({ errorMsg: "물성 분석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          clearStages(["property", "perception", "emotion"]);
          state.editSel = {};
          setState({ properties, perceptions: [], emotion: null, step: 2 }, true);
          persist(false);
          await Actions.buildStageImages("property", null);
        },

        /* ---- 3단계 : 지각 분석 (전체) ---- */
        async generatePerceptions(instruction) {
          const o = state.object;
          if (!o || !state.properties.length) { setState({ errorMsg: "물성 분석을 먼저 진행해 주세요." }); return; }

          const data = await withLoading("사람이 무엇을 지각하게 되는지 정리하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.PERCEPTION(o, state.properties, instruction || "")));
          if (!data) return;

          const perceptions = normPerceptions(data, state.properties);
          if (!perceptions.length) { setState({ errorMsg: "지각 분석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          clearStages(["perception", "emotion"]);
          state.editSel = Object.assign({}, state.editSel, { perception: undefined, emotion: undefined });
          setState({ perceptions, emotion: null, step: 3 }, true);
          persist(false);
          await Actions.buildStageImages("perception", null);
        },

        /* ---- 4단계 : 감성 분석 (전체) ---- */
        async generateEmotion(instruction) {
          const o = state.object;
          if (!o || !state.perceptions.length) { setState({ errorMsg: "지각 분석을 먼저 진행해 주세요." }); return; }

          const data = await withLoading("지각이 어떤 감성으로 이어지는지 분석하고 있습니다", () =>
            callText(SYSTEM, PROMPTS.EMOTION(o, state.perceptions, instruction || "")));
          if (!data) return;

          const emotion = normEmotion(data, state.perceptions);
          if (!emotion) { setState({ errorMsg: "감성 분석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          clearStages(["emotion"]);
          state.editSel = Object.assign({}, state.editSel, { emotion: undefined });
          setState({ emotion, step: 4 }, true);
          persist(false);
          await Actions.buildStageImages("emotion", null);
        },

        /* ---- 수정 지시 ---- */
        pickEditTarget(stage, v) {
          state.editSel = Object.assign({}, state.editSel, { [stage]: v });
          render();
        },

        async editItem(stage) {
          const items = stageItems(stage);
          if (!items.length) return;
          const insId = `ins-${stage}`;
          const ins = draft(insId).trim();
          const sel = editSelection(stage);

          /* 전체 다시 생성 — 이후 단계는 근거가 바뀌므로 초기화합니다. */
          if (sel === "all") {
            const hasDownstream = (stage === "property" && state.perceptions.length) || (stage === "perception" && state.emotion);
            if (hasDownstream && !window.confirm("전체를 다시 생성하면 이후 단계 결과와 이미지가 지워집니다. 계속할까요?")) return;
            drafts[insId] = "";
            if (stage === "property") await Actions.generateProperties(ins);
            else if (stage === "perception") await Actions.generatePerceptions(ins);
            else await Actions.generateEmotion(ins);
            return;
          }

          /* 개별 수정 — 선택한 항목 하나만 바꾸고 나머지는 객체 그대로 둡니다. */
          const target = items[sel - 1];
          if (!target) return;
          const o = state.object;
          const others = items.filter(it => it.id !== target.id);
          let prompt, photo = null;
          if (stage === "property") {
            photo = state.images.source;
            prompt = itemEditPrompt(PROMPTS.PROPERTY(o, state.traits, !!photo, ""), "물성 분석", listProperties(others), target, {
              axis: target.axis, titleKo: target.titleKo, titleEn: target.titleEn, description: target.description,
              from: idsToNums(target.fromIds, state.traits), measure: target.measure, value: target.value,
              level: target.level, visual: target.visual
            }, ins);
          } else if (stage === "perception") {
            prompt = itemEditPrompt(PROMPTS.PERCEPTION(o, state.properties, ""), "지각 분석", listPerceptions(others), target, {
              moment: target.moment, situation: target.situation, titleKo: target.titleKo, titleEn: target.titleEn,
              description: target.description, from: idsToNums(target.fromIds, state.properties), cue: target.cue,
              visual: target.visual, label: target.label, labelKo: target.labelKo, style: target.style
            }, ins);
          } else {
            prompt = itemEditPrompt(PROMPTS.EMOTION(o, state.perceptions, ""), "감성 분석",
              others.map(l => `${l.index}. [${l.phase}] ${l.nameKo} (${l.nameEn}) — ${l.description}`).join("\n"), target, {
                category: target.phase, nameKo: target.nameKo, nameEn: target.nameEn, description: target.description,
                from: idsToNums(target.fromIds, state.perceptions), intensity: target.intensity,
                visual: target.visual, label: target.label, labelKo: target.labelKo, style: target.style
              }, ins);
          }

          const data = await withLoading(`${pad2(target.index)}번 항목을 다시 작성하고 있습니다`, () =>
            callText(SYSTEM, prompt, photo));
          if (!data) return;
          const raw = pickEditedItem(data);
          if (!raw) { setState({ errorMsg: "수정된 항목을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          const i = target.index - 1;
          let fresh;
          if (stage === "property") fresh = normProperty(raw, i, state.traits);
          else if (stage === "perception") fresh = normPerception(raw, i, state.properties);
          else fresh = normLayer(raw, i, state.perceptions);
          /* id와 번호를 그대로 유지해야 다음 단계의 근거 연결이 끊기지 않습니다. */
          fresh.id = target.id;
          fresh.index = target.index;

          const replaced = items.map(it => (it.id === target.id ? fresh : it));
          if (stage === "property") state.properties = replaced;
          else if (stage === "perception") state.perceptions = replaced;
          else state.emotion = Object.assign({}, state.emotion, { layers: replaced });
          drafts[insId] = "";
          persist(false);
          render();

          if (isLegacyBoard(stage)) {
            toast("이전 버전에서 만든 보드라 이미지는 그대로 두었습니다.");
            return;
          }
          await removeItemImage(stage, target.id);
          await Actions.buildStageImages(stage, [target.id]);
          toast(`${pad2(target.index)}번 항목만 수정했습니다. 다른 항목은 그대로입니다.`);
        }
      };

            ${e.trace ? `<p class="t-meta text-slate-600 prose-ko mt-4 pt-4 border-t border-slate-100">지각에서 온 근거 · ${esc(e.trace)}</p>` : ""}
          </section>

          ${imageCard("emotion", {
            title: "대표 감성 키워드 이미지",
            alt: "사물 경험에서 도출된 주요 감성들의 무드 이미지",
            empty: "대표 감성 키워드 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.buildMissing('emotion')"
          })}

          <h3 class="t-h3 text-slate-900 mb-3 px-1">대표 감성 키워드 2개</h3>
          <div class="space-y-3">${layers}</div>
          ${instructionBox("emotion", "예: 서로 상반된 지각이 만드는 긴장감을 감성 정의에 더 반영해 주세요")}

          ${dock(`
            <div class="space-y-2.5">
              ${primaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()")}
            </div>
          `)}
        </div>`;
      }

      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2 prose-ko">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-8">1분 넘게 걸릴 수 있습니다</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.lightbox && state.images && state.images[state.lightbox]) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/90 flex flex-col max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
            <div class="flex justify-between items-center p-3">
              <button type="button" onclick="Actions.downloadImage('${escAttr(state.lightbox)}')" class="px-4 py-2.5 rounded-full bg-white/10 text-white font-bold t-meta inline-flex items-center gap-1.5"><i data-lucide="download" class="w-5 h-5"></i>내려받기</button>
              <button type="button" onclick="Actions.closeLightbox()" aria-label="닫기" class="p-3 rounded-full bg-white/10 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-auto px-3 pb-6 no-scrollbar">
              <img src="${escAttr(state.images[state.lightbox])}" alt="확대한 이미지" class="w-full rounded-2xl" />
            </div>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6 prose-ko">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && el.type !== "file")
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 */ }
          }
        }
        try { window.scrollTo(0, resetScroll ? 0 : snap.scrollY); } catch (e) { /* 무시 */ }
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}}, true)`)}
          </div>
        </div>`;
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewInput();
          case 2:  return state.properties.length ? viewProperty() : fallback(1, "분석된 물성이 없습니다.");
          case 3:  return state.perceptions.length ? viewPerception() : fallback(2, "분석된 지각이 없습니다.");
          case 4:  return state.emotion ? viewEmotion() : fallback(3, "분석된 감성이 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        if (state.step >= 1) lastWorkStep = state.step;
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.lightbox) Actions.closeLightbox();
        else if (state.isAnalyzing) Actions.cancel();
      });

      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, CONFIG.AUTOSAVE_MS);
      window.addEventListener("beforeunload", () => { try { persist(false); } catch (e) { /* 무시 */ } });
      /* 휴대폰은 앱 전환 때 페이지가 그대로 종료될 수 있어 화면이 가려질 때 바로 저장합니다. */
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { try { persist(false); } catch (e) { /* 무시 */ } } });
      window.addEventListener("pagehide", () => { try { persist(false); } catch (e) { /* 무시 */ } });
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 무시 */ }

      loadSession();
      if (state.apiKey) state.step = 0;
      render(true);
      Store.migrateFromIdb().then(moved => { if (moved && state.step === 0) render(); });
    })();
  </script>
</body>
</html>
